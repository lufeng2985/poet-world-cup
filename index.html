  function revivalSummary(title, state) {
    if (!state || !state.selected) return "";
    return `<div class="result-section"><h3>${escapeHtml(title)}</h3><p>${state.selected.map((poet) => escapeHtml(poet.name)).join("、")}</p></div>`;
  }

  function byeSummary(state) {
    if (!state || !state.selected) return "";
    return `<div class="result-section"><h3>首轮轮空</h3><p>${state.selected.map((poet) => escapeHtml(poet.name)).join("、")}</p></div>`;
  }

  function advancedIds(round) {
    return new Set(round.matches.map((match) => match.winner && match.winner.id).filter(Boolean));
  }

  function sideEntries(round, side) {
    if (round.matches.length === 1) {
      const match = round.matches[0];
      const poet = side === "left" ? match.a : match.b;
      return poet ? [{ poet, match, matchIndex: 0 }] : [];
    }
    const midpoint = Math.ceil(round.matches.length / 2);
    const offset = side === "left" ? 0 : midpoint;
    const matches = side === "left" ? round.matches.slice(0, midpoint) : round.matches.slice(midpoint);
    return matches.flatMap((match, index) => [match.a, match.b]
      .filter(Boolean)
      .map((poet) => ({ poet, match, matchIndex: offset + index })));
  }

  function orderKnockoutRounds(rounds) {
    if (!rounds.length) return [];
    const orderedMatches = Array(rounds.length);
    orderedMatches[rounds.length - 1] = [...rounds.at(-1).matches];

    // Rebuild the tree backwards from the final. This also repairs the
    // presentation of tournaments completed under older versions that
    // accidentally redrew the bracket after every round.
    for (let roundIndex = rounds.length - 2; roundIndex >= 0; roundIndex -= 1) {
      const desiredWinnerIds = orderedMatches[roundIndex + 1]
        .flatMap((match) => [match.a, match.b])
        .filter(Boolean)
        .map((poet) => poet.id);
      const matchesByWinner = new Map(
        rounds[roundIndex].matches
          .filter((match) => match.winner)
          .map((match) => [match.winner.id, match])
      );
      const ordered = desiredWinnerIds.map((id) => matchesByWinner.get(id)).filter(Boolean);
      const included = new Set(ordered);
      orderedMatches[roundIndex] = [
        ...ordered,
        ...rounds[roundIndex].matches.filter((match) => !included.has(match))
      ];
    }

    return rounds.map((round, index) => {
      const matches = orderedMatches[index];
      return {
        ...round,
        matches,
        entrants: matches.flatMap((match) => [match.a, match.b]).filter(Boolean)
      };
    });
  }

  function bracketNode(poet, advanced) {
    return `<div class="bracket-node ${advanced ? "advanced" : ""}">
      <span>${escapeHtml(poet.name)}</span>${advanced ? '<b>晋</b>' : ""}
    </div>`;
  }

  function bracketStage(round, roundIndex, side) {
    const entries = sideEntries(round, side);
    const advanced = advancedIds(round);
    return `<div class="bracket-stage ${side}" data-round="${roundIndex}">
      <div class="bracket-stage-label">${roundLabel(round.entrants.length)}</div>
      <div class="bracket-stage-nodes">
        ${entries.map(({ poet }) => bracketNode(poet, advanced.has(poet.id))).join("")}
      </div>
    </div>`;
  }

  function symmetricBracket(rounds) {
    const orderedRounds = orderKnockoutRounds(rounds);
    const left = orderedRounds.map((round, index) => bracketStage(round, index, "left")).join("");
    const right = orderedRounds.map((round, index) => bracketStage(round, index, "right")).reverse().join("");
    return `<div class="symmetric-bracket" style="--round-count:${orderedRounds.length}">
      <div class="bracket-wing left-wing">${left}</div>
      <div class="bracket-center">
        <span class="cup-mark">诗界杯</span>
        <small>CHAMPION</small>
        <strong>${escapeHtml(tournament.champion.name)}</strong>
        <i>${escapeHtml(tournament.title)}</i>
      </div>
      <div class="bracket-wing right-wing">${right}</div>
    </div>`;
  }

  function renderResult() {
    const rounds = tournament.knockout.rounds;
    app.innerHTML = `
      <section class="result-head">
        <p class="eyebrow">TOURNAMENT COMPLETE</p>
        <h1>${escapeHtml(fullTitle(tournament.title))}</h1>
        <p class="lead" style="margin-left:auto;margin-right:auto">从 ${tournament.initialCount} 位选手中产生了你的冠军。对阵图由左右两侧逐轮向中央汇合。</p>
        <div class="result-actions">
          <button class="primary-button" type="button" data-action="download">下载晋级图 PNG</button>
          <button class="quiet-button" type="button" data-action="new-game">再来一次</button>
        </div>
      </section>
      <section class="result-card">
        <div class="result-section bracket-result-section">
          <div class="bracket-title-row">
            <h3>淘汰赛完整对阵</h3>
            <span>左右滑动查看完整签表</span>
          </div>
          <div class="bracket-wrap">${symmetricBracket(rounds)}</div>
        </div>
        ${statisticsMarkup()}
        ${tournament.cut && tournament.cut.kept ? `<div class="result-section"><h3>名单裁定</h3><p>保留：${tournament.cut.kept.map((poet) => escapeHtml(poet.name)).join("、")}</p></div>` : ""}
        ${byeSummary(tournament.byeSelection)}
        ${groupSummary("预选赛", tournament.prelim)}
        ${revivalSummary("预选复活", tournament.prelimRevival)}
        ${groupSummary("小组赛", tournament.groupStage)}
        ${revivalSummary("小组复活", tournament.groupRevival)}
      </section>`;
    updateResumeButton();
    submitStatistics();
  }

  function renderStage() {
    if (!tournament) return renderHome();
    if (tournament.phase === "cut") return renderCut();
    if (tournament.phase === "prelim" || tournament.phase === "groups") return renderGroups();
    if (tournament.phase === "prelim-revival" || tournament.phase === "group-revival") return renderRevival();
    if (tournament.phase === "bye-selection") return renderByeSelection();
    if (tournament.phase === "transition") return renderTransition();
    if (tournament.phase === "knockout") return renderKnockout();
    if (tournament.phase === "result") return renderResult();
  }

  function downloadResult() {
    const rounds = orderKnockoutRounds(tournament.knockout.rounds);
    const width = 1900;
    const outerCount = Math.max(sideEntries(rounds[0], "left").length, sideEntries(rounds[0], "right").length);
    const height = Math.max(1120, outerCount * 58 + 250);
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#eee9de";
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = "#122d27";
    ctx.fillRect(0, 0, width, 136);
    ctx.textAlign = "center";
    ctx.fillStyle = "#d5b575";
    ctx.font = '700 18px "Microsoft YaHei", sans-serif';
    ctx.fillText("POET WORLD CUP", width / 2, 42);
    ctx.fillStyle = "#ffffff";
    ctx.font = '800 38px "Microsoft YaHei", sans-serif';
    ctx.fillText(fullTitle(tournament.title), width / 2, 92);

    const nodeWidth = 132;
    const nodeHeight = 34;
    const stageGap = 150;
    const top = 190;
    const areaHeight = height - 270;
    const centerX = width / 2;

    const drawWing = (side) => {
      rounds.forEach((round, roundIndex) => {
        const entries = sideEntries(round, side);
        const advanced = advancedIds(round);
        const x = side === "left"
          ? 40 + roundIndex * stageGap
          : width - 40 - nodeWidth - roundIndex * stageGap;

        ctx.textAlign = "center";
        ctx.fillStyle = "#756e61";
        ctx.font = '600 11px "Microsoft YaHei", sans-serif';
        ctx.fillText(roundLabel(round.entrants.length), x + nodeWidth / 2, top - 22);

        entries.forEach((entry, index) => {
          const poet = entry.poet;
          const y = top + ((index + .5) * areaHeight / entries.length) - nodeHeight / 2;
          const passed = advanced.has(poet.id);
          ctx.fillStyle = passed ? "#fffdf8" : "#e3ded3";
          ctx.strokeStyle = passed ? "#9f352d" : "#c9c2b5";
          ctx.lineWidth = passed ? 2 : 1;
          ctx.beginPath();
          ctx.roundRect(x, y, nodeWidth, nodeHeight, 6);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = passed ? "#18201d" : "#8b857a";
          ctx.textAlign = "center";
          ctx.font = `${passed ? "700" : "400"} 13px "Microsoft YaHei", sans-serif`;
          ctx.fillText(poet.name, x + nodeWidth / 2, y + 22);

          const nextEntries = roundIndex + 1 < rounds.length ? sideEntries(rounds[roundIndex + 1], side) : [];
          const successor = entry.match.winner;
          const nextIndex = successor ? nextEntries.findIndex((item) => item.poet.id === successor.id) : -1;
          const nextY = roundIndex + 1 < rounds.length && nextIndex >= 0
            ? top + ((nextIndex + .5) * areaHeight / nextEntries.length)
            : top + areaHeight / 2;
          const startX = side === "left" ? x + nodeWidth : x;
          const endX = roundIndex + 1 < rounds.length
            ? (side === "left" ? x + stageGap : x - stageGap + nodeWidth)
            : centerX + (side === "left" ? -105 : 105);
          const midX = (startX + endX) / 2;
          ctx.strokeStyle = passed ? "#a23a31" : "#c8c1b5";
          ctx.lineWidth = passed ? 1.6 : 1;
          ctx.beginPath();
          ctx.moveTo(startX, y + nodeHeight / 2);
          ctx.lineTo(midX, y + nodeHeight / 2);
          ctx.lineTo(midX, nextY);
          ctx.lineTo(endX, nextY);
          ctx.stroke();
        });
      });
    };

    drawWing("left");
    drawWing("right");

    const championY = top + areaHeight / 2 - 92;
    ctx.fillStyle = "#9f352d";
    ctx.beginPath();
    ctx.roundRect(centerX - 108, championY, 216, 184, 12);
    ctx.fill();
    ctx.fillStyle = "#e9d49f";
    ctx.font = '700 13px "Microsoft YaHei", sans-serif';
    ctx.fillText("诗界杯 · CHAMPION", centerX, championY + 38);
    ctx.fillStyle = "#ffffff";
    ctx.font = '800 36px "Microsoft YaHei", sans-serif';
    ctx.fillText(tournament.champion.name, centerX, championY + 101);
    ctx.fillStyle = "#f1dcd7";
    ctx.font = '500 12px "Microsoft YaHei", sans-serif';
    ctx.fillText(tournament.title, centerX, championY + 137);

    const filename = `${fullTitle(tournament.title)}-${tournament.champion.name}.png`;
    const trigger = (url) => {
      const link = document.createElement("a");
      link.download = filename;
      link.href = url;
      link.click();
    };
    canvas.toBlob((blob) => {
      if (!blob) return trigger(canvas.toDataURL("image/png"));
      const url = URL.createObjectURL(blob);
      trigger(url);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, "image/png");
  }

  document.addEventListener("click", (event) => {
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;

    if (action === "home") {
      event.preventDefault();
      renderHome();
    } else if (action === "mode") {
      mode = target.dataset.mode;
      renderHome();
      document.getElementById("selection")?.scrollIntoView({ behavior: "smooth" });
    } else if (action === "period-tag") {
      const value = target.dataset.value;
      selectedPeriods.has(value) ? selectedPeriods.delete(value) : selectedPeriods.add(value);
      resetSelectionToTags();
      renderHome();
    } else if (action === "genre-tag") {
      const value = target.dataset.value;
      selectedGenres.has(value) ? selectedGenres.delete(value) : selectedGenres.add(value);
      resetSelectionToTags();
      renderHome();
    } else if (action === "toggle-poet") {
      const id = target.dataset.id;
      selectedCustom.has(id) ? selectedCustom.delete(id) : selectedCustom.add(id);
      renderHome();
    } else if (action === "select-all") {
      selectedCustom = new Set(filteredPoets().map((poet) => poet.id));
      renderHome();
    } else if (action === "clear-selection") {
      selectedCustom.clear();
      renderHome();
    } else if (action === "random-48") {
      const filtered = filteredPoets();
      selectedCustom = new Set(shuffle(filtered).slice(0, Math.min(48, filtered.length)).map((poet) => poet.id));
      renderHome();
    } else if (action === "system-select") {
      const count = Number(target.dataset.count);
      const currentPool = filteredPoets();
      if (currentPool.length > count) {
        selectedCustom = new Set(topRanked(currentPool, count).map((poet) => poet.id));
        renderHome();
      }
    } else if (action === "start") {
      startTournament();
    } else if (action === "open-works") {
      showRepresentativeWorks(target.dataset.id, target);
    } else if (action === "close-works") {
      hideRepresentativeWorks();
    } else if (action === "stage-toggle") {
      const limit = tournament.phase === "cut"
        ? tournament.cut.target
        : (tournament.phase === "bye-selection"
          ? tournament.byeSelection.required
        : (tournament.phase.includes("revival")
          ? (tournament.phase === "prelim-revival" ? tournament.prelimRevival.required : tournament.groupRevival.required)
          : 2));
      toggleStageSelection(target.dataset.id, limit);
    } else if (action === "confirm-cut") {
      confirmCut();
    } else if (action === "system-cut") {
      stageSelection = new Set(topRanked(tournament.cut.entrants, tournament.cut.target).map((poet) => poet.id));
      renderStage();
    } else if (action === "confirm-group") {
      confirmGroup();
    } else if (action === "confirm-revival") {
      confirmRevival();
    } else if (action === "confirm-byes") {
      confirmByes();
    } else if (action === "choose") {
      chooseWinner(target.dataset.id);
    } else if (action === "continue-stage") {
      continueTransition();
    } else if (action === "undo") {
      undo();
    } else if (action === "leave-game") {
      renderHome();
    } else if (action === "restart") {
      showRestartConfirmation(target);
    } else if (action === "cancel-restart") {
      hideRestartConfirmation();
    } else if (action === "confirm-restart") {
      abandonTournament();
    } else if (action === "new-game") {
      abandonTournament();
    } else if (action === "resume") {
      tournament = loadTournament();
      stageSelection.clear();
      undoStack = [];
      tournament ? renderStage() : renderHome();
    } else if (action === "download") {
      downloadResult();
    } else if (action === "retry-statistics") {
      submitStatistics();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      hideRepresentativeWorks();
      hideRestartConfirmation();
    }
  });

  document.querySelector("[data-confirm-restart]")?.addEventListener("click", (event) => {
    if (event.target === event.currentTarget) hideRestartConfirmation();
  });

  document.querySelector("[data-works-overlay]")?.addEventListener("click", (event) => {
    if (event.target === event.currentTarget) hideRepresentativeWorks();
  });

  document.addEventListener("input", (event) => {
    if (!event.target.matches("[data-search]")) return;
    searchText = event.target.value;
    const visible = filteredPoets().filter((poet) => poet.name.includes(searchText.trim()));
    const grid = document.querySelector(".poet-grid");
    if (grid) {
      grid.innerHTML = visible.length
        ? visible.map((poet) => poetChip(poet, selectedCustom.has(poet.id))).join("")
        : '<div class="empty">当前标签或搜索条件下没有作者。</div>';
    }
  });

  function validateKnockout() {
    const errors = [];
    const rounds = tournament?.knockout?.rounds || [];
    rounds.forEach((round, index) => {
      round.matches.forEach((match, matchIndex) => {
        if (!match.winner) errors.push(`round ${index} match ${matchIndex}: missing winner`);
        else if (match.winner.id !== match.a?.id && match.winner.id !== match.b?.id) errors.push(`round ${index} match ${matchIndex}: winner not in match`);
      });
      if (index + 1 < rounds.length) {
        const expected = round.matches.map((match) => match.winner?.id).filter(Boolean);
        const actual = rounds[index + 1].entrants.map((poet) => poet.id);
        if (expected.join("|") !== actual.join("|")) errors.push(`round ${index}: successor order mismatch`);
      }
    });
    if (tournament?.champion && rounds.length) {
      const finalWinner = rounds.at(-1).matches[0]?.winner;
      if (!finalWinner || finalWinner.id !== tournament.champion.id) errors.push("champion mismatch");
    }
    return { valid: errors.length === 0, errors, rounds: rounds.length };
  }

  window.__SHIJIE_CUP_TEST__ = { formatForCount, buildGroups, byeCountFor, buildKnockoutRound, orderKnockoutRounds, placementsFromTournament, validateKnockout, getTournament: () => tournament };
  updateResumeButton();
  renderHome();
})();

</script>
</body>
</html>
