<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Poet World Cup｜从中国古代诗人、词人中选出你的诗界杯冠军">
  <title>Poet World Cup｜诗界杯</title>
  <style>
:root {
  --paper: #f2f0ea;
  --paper-2: #e5e1d8;
  --card: #ffffff;
  --ink: #151815;
  --muted: #6b706b;
  --line: #d7d3c9;
  --forest: #12382f;
  --forest-2: #081d19;
  --red: #d94b3d;
  --red-2: #a82e26;
  --gold: #d6ae61;
  --lime: #d8bd82;
  --white: #fff;
  --shadow: 0 24px 70px rgba(18, 26, 22, .11);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--paper); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  margin: -1px;
  padding: 0;
  border: 0;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}
body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", Arial, sans-serif;
}
button, input { font: inherit; }
button { color: inherit; }
.paper-noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .55;
  background-image: radial-gradient(rgba(8,29,25,.13) .55px, transparent .55px);
  background-size: 5px 5px;
}

.masthead {
  position: sticky;
  z-index: 40;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 76px;
  padding: 11px clamp(18px, 4vw, 64px);
  border-bottom: 1px solid rgba(255,255,255,.1);
  background: rgba(8,29,25,.97);
  color: var(--white);
  backdrop-filter: blur(18px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  color: inherit;
  text-decoration: none;
}
.brand strong { display: block; font-size: 16px; font-weight: 850; letter-spacing: .13em; }
.brand small { display: block; margin-top: 4px; color: #96aaa4; font-size: 10px; letter-spacing: .09em; }
.brand-mark {
  display: grid;
  width: 43px;
  height: 43px;
  place-content: center;
  border: 1px solid #e6a093;
  border-radius: 4px;
  background: #9e2f27;
  color: #fff5e6;
  font-family: "Songti SC", SimSun, serif;
  font-size: 20px;
  font-weight: 950;
}
.masthead .quiet-button { border-color: rgba(255,255,255,.35); color: var(--white); }
.masthead .quiet-button:hover { border-color: var(--white); background: var(--white); color: var(--forest-2); }

.app {
  position: relative;
  width: min(1240px, calc(100% - 32px));
  min-height: calc(100vh - 140px);
  margin: 0 auto;
  padding: clamp(24px, 4vw, 52px) 0 64px;
}
.hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(350px, .92fr);
  gap: clamp(28px, 5vw, 66px);
  align-items: center;
}

}
.lishu-subtitle img {
  display: block;
  width: clamp(330px, 35vw, 470px);
  max-width: 100%;
  height: auto;
}
.lead { max-width: 700px; margin-bottom: 30px; color: var(--muted); font-size: clamp(15px, 1.6vw, 18px); line-height: 1.9; }
.hero-arena .lead { max-width: 570px; color: #b9c8c3; font-size: 16px; line-height: 1.85; }
.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  overflow: hidden;
  max-width: 570px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 13px;
  background: rgba(255,255,255,.045);
}
.stat { min-height: 96px; padding: 20px; border-right: 1px solid rgba(255,255,255,.12); }
.stat:last-child { border-right: 0; }
.stat strong { display: block; color: var(--white); font-size: 29px; font-weight: 880; }
.stat span { color: #93aaa3; font-size: 11px; letter-spacing: .08em; }

.filter-panel, .result-card, .stage-card {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255,255,255,.9);
  box-shadow: var(--shadow);
}
.hero-console {
  padding: 10px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 19px;
  background: rgba(5,22,18,.52);
  box-shadow: 0 22px 58px rgba(0,0,0,.2);
  backdrop-filter: blur(12px);
}
.console-head {
  display: flex;
  justify-content: space-between;
  padding: 12px 13px 18px;
  color: #879e97;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .14em;
}
.mode-panel { overflow: hidden; }
.mode-card {
  width: 100%;
  padding: 23px;
  border: 0;
  border: 1px solid transparent;
  border-radius: 12px;
  background: rgba(255,255,255,.035);
  cursor: pointer;
  text-align: left;
  transition: background .18s ease, transform .18s ease;
}
.mode-card + .mode-card { margin-top: 6px; }
.mode-card:hover { background: rgba(255,255,255,.075); }
.mode-card.active { border-color: rgba(216,189,130,.55); background: #eadbb8; color: var(--forest-2); }
.mode-card small { display: block; margin-bottom: 7px; color: #e27c71; font-size: 10px; font-weight: 850; letter-spacing: .17em; }
.mode-card.active small { color: #58711a; }
.mode-card strong { display: block; margin-bottom: 7px; font-size: 20px; }
.mode-card span { color: #9db0aa; font-size: 12px; line-height: 1.65; }
.mode-card.active span { color: #3c4a21; }
.console-route {
  display: grid;
  grid-template-columns: auto 1fr auto 1fr auto 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 21px 14px 10px;
}
.console-route span {
  display: grid;
  width: 34px;
  height: 34px;
  place-content: center;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50%;
  color: #dce7e3;
  font-size: 11px;
  font-weight: 800;
}
.console-route span:last-child { border-color: var(--red); background: var(--red); color: white; }
.console-route i { height: 1px; background: rgba(255,255,255,.19); }
.console-note { margin: 10px 14px 14px; color: #7f9690; font-size: 11px; }
.art-credit { margin: 0 14px 12px; color: rgba(207,220,215,.48); font-size: 9px; }

.section { margin-top: 42px; scroll-margin-top: 92px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
.section-heading h2 { margin-bottom: 6px; font-size: clamp(28px, 4.5vw, 46px); font-weight: 820; letter-spacing: -.04em; }
.section-heading p { margin: 0; color: var(--muted); line-height: 1.7; }
.filter-panel { padding: clamp(20px, 4vw, 36px); }
.filter-row { display: grid; grid-template-columns: 108px 1fr; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.filter-row:first-child { padding-top: 0; }
.filter-row:last-of-type { border-bottom: 0; }
.filter-label { padding-top: 9px; color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .13em; }
.tag-list { display: flex; flex-wrap: wrap; gap: 9px; }
.tag {
  min-height: 40px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  cursor: pointer;
  transition: .16s ease;
}
.tag:hover { border-color: var(--forest); }
.tag.selected { border-color: var(--forest); background: var(--forest); color: var(--white); }
.selection-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 24px 0 18px; }
.search {
  flex: 1 1 220px;
  min-height: 44px;
  padding: 0 15px;
  border: 1px solid var(--line);
  border-radius: 8px;
  outline: none;
  background: var(--card);
}
.search:focus { border-color: var(--forest); box-shadow: 0 0 0 3px rgba(22,61,52,.1); }
.quiet-button, .primary-button, .danger-button, .rank-button {
  min-height: 44px;
  padding: 10px 17px;
  border: 1px solid var(--forest);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  font-weight: 680;
  transition: .16s ease;
}
.quiet-button:hover { background: var(--forest); color: var(--white); }
.quiet-button:disabled, .primary-button:disabled { opacity: .42; cursor: not-allowed; }
.primary-button { border-color: var(--red); background: var(--red); color: var(--white); }
.primary-button:hover { border-color: var(--red-2); background: var(--red-2); }
.rank-button {
  border-color: var(--forest);
  background: var(--forest);
  color: var(--white);
}
.rank-button:hover { border-color: var(--forest-2); background: var(--forest-2); }
.rank-button:disabled { opacity: .35; cursor: not-allowed; }
.danger-button { border-color: var(--red); color: var(--red); }
.danger-button:hover { background: var(--red); color: var(--white); }
.pool-summary { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 20px 0 15px; }
.count strong { color: var(--forest); font-size: 31px; }
.count span { color: var(--muted); }
.eligibility { padding: 8px 12px; border-radius: 7px; background: #ece8dd; color: var(--muted); font-size: 12px; }
.eligibility.ready { background: #dce9e3; color: var(--forest); }
.eligibility.blocked { background: #f3dfdb; color: var(--red-2); }
.poet-grid { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 8px; max-height: 430px; padding-right: 6px; overflow: auto; }
.poet-chip {
  position: relative;
  min-height: 72px;
  padding: 12px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  cursor: pointer;
  text-align: left;
}
.poet-chip:hover { border-color: var(--forest); }
.poet-chip.selected { border-color: #7ba394; background: #dfebe5; }
.poet-chip strong { display: block; font-family: "Songti SC", SimSun, serif; font-size: 17px; }
.poet-chip small { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; }
.poet-chip.selected::after { position: absolute; top: 7px; right: 8px; color: var(--forest); content: "✓"; font-weight: 800; }
.start-bar {
  position: sticky;
  z-index: 15;
  bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-top: 24px;
  padding: 14px 15px 14px 19px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,253,248,.96);
  box-shadow: 0 16px 46px rgba(31,42,35,.16);
  backdrop-filter: blur(12px);
}
.start-bar p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
.start-bar strong { color: var(--ink); }

.stage-shell { max-width: 1040px; margin: 0 auto; }
.stage-top { display: flex; align-items: start; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
.stage-top h1 { margin-bottom: 8px; font-size: clamp(38px, 6vw, 68px); }
.stage-meta { color: var(--muted); line-height: 1.7; }
.stage-progress { height: 5px; margin: 16px 0 30px; overflow: hidden; border-radius: 99px; background: var(--paper-2); }
.stage-progress > div { height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--red),var(--gold)); transition: width .2s ease; }
.stage-card { padding: clamp(20px,4vw,38px); }
.stage-kicker { margin-bottom: 11px; color: var(--red); font-size: 11px; font-weight: 800; letter-spacing: .16em; }
.stage-card h2 { margin-bottom: 10px; font-size: clamp(25px,4vw,39px); letter-spacing: -.035em; }
.stage-instruction { margin-bottom: 24px; color: var(--muted); line-height: 1.7; }
.candidate-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; }
.candidate-grid.triad { grid-template-columns: repeat(3,minmax(0,1fr)); }
.candidate-card-shell, .revival-card-shell, .fighter-shell { display: flex; min-width: 0; flex-direction: column; }
.candidate-card {
  position: relative;
  min-height: 190px;
  padding: 20px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  cursor: pointer;
  text-align: center;
  transition: transform .16s ease, border-color .16s ease, background .16s ease;
}
.candidate-card-shell .candidate-card { width: 100%; flex: 1; }
.works-button {
  width: 100%;
  margin-top: 7px;
  padding: 7px 8px;
  border: 0;
  background: transparent;
  color: #716b60;
  cursor: pointer;
  font-size: 11px;
  text-decoration: underline;
  text-decoration-color: rgba(113,107,96,.35);
  text-underline-offset: 3px;
}
.works-button:hover, .works-button:focus-visible { color: var(--red); text-decoration-color: currentColor; }
.candidate-card:hover { transform: translateY(-3px); border-color: var(--forest); }
.candidate-card.selected { border-color: var(--red); background: #f8e9e5; box-shadow: inset 0 0 0 1px var(--red); }
.candidate-card.eliminate.selected { border-color: #7a7770; background: #e6e2d9; color: #6a6760; }
.candidate-card .number { display: block; margin-bottom: 26px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .15em; }
.candidate-card strong { display: block; font-family: "Songti SC", SimSun, serif; font-size: clamp(27px,3.4vw,42px); font-weight: 700; line-height: 1.05; }
.candidate-card small { display: block; margin-top: 18px; color: var(--muted); font-size: 11px; }
.candidate-card.selected::after { position: absolute; top: 10px; right: 11px; color: var(--red); content: "✓"; font-weight: 900; }
.group-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 22px; }
.group-footer p { margin: 0; color: var(--muted); font-size: 13px; }
.inline-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.stage-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }

.revival-grid { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 8px; max-height: 520px; overflow: auto; }
.revival-card { min-height: 82px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; text-align: left; }
.revival-card strong { display: block; font-family: "Songti SC", SimSun, serif; font-size: 17px; }
.revival-card span { display: block; margin-top: 8px; color: var(--muted); font-size: 10px; }
.revival-card.selected { border-color: var(--red); background: #f8e9e5; }
.revival-card-shell .revival-card { width: 100%; flex: 1; }
.works-button.compact { margin-top: 3px; padding-block: 4px; font-size: 9px; }

.versus { display: grid; grid-template-columns: 1fr 72px 1fr; align-items: stretch; gap: 16px; }
.fighter {
  min-height: 340px;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .16s ease, border-color .16s ease;
}
.fighter-shell .fighter { width: 100%; flex: 1; }
.fighter-works { margin-top: 9px; }
.fighter:hover { transform: translateY(-4px); border-color: var(--red); }
.fighter-index { color: var(--red); font-size: 10px; font-weight: 800; letter-spacing: .18em; }
.fighter-name { display: grid; min-height: 190px; place-content: center; font-family: "Songti SC", SimSun, serif; font-size: clamp(48px,7vw,78px); line-height: 1; text-align: center; }
.fighter-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
.mini-tag { padding: 5px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 10px; }
.vs-mark { display: grid; place-content: center; color: var(--red); font-size: 18px; font-weight: 900; font-style: italic; }
.bye-note { margin: -10px 0 24px; padding: 11px 15px; border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; background: #eee5d2; color: var(--muted); font-size: 13px; }

.transition-emblem {
  position: absolute;
  top: 18px;
  right: clamp(20px,4vw,48px);
  display: grid;
  width: 64px;
  height: 64px;
  place-content: center;
  border: 1px solid rgba(159,53,45,.35);
  border-radius: 50%;
  color: var(--red);
  font-family: "Songti SC",STSong,SimSun,serif;
  font-size: 34px;
  opacity: .8;
}
.transition-card > h2 { margin-bottom: 8px; font-size: clamp(28px,4vw,44px); }
.transition-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; }
.transition-panel { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,253,248,.84); }
.transition-panel.advanced { border-color: rgba(159,53,45,.44); }
.transition-panel.eliminated { background: rgba(227,222,211,.76); }
.transition-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
.transition-panel-head h3 { margin: 0; font-size: 18px; }
.transition-panel-head b { display: grid; width: 30px; height: 30px; place-content: center; border-radius: 50%; background: var(--forest); color: white; font-size: 12px; }
.transition-panel.eliminated .transition-panel-head b { background: #918a7f; }
.transition-list { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; max-height: 410px; overflow: auto; }
.transition-person { min-width: 0; padding: 11px; border: 1px solid var(--line); border-radius: 8px; }
.transition-person strong { display: block; overflow: hidden; font-family: "Songti SC",STSong,SimSun,serif; font-size: 18px; text-overflow: ellipsis; white-space: nowrap; }
.transition-person span { display: block; overflow: hidden; margin-top: 5px; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.transition-person.advanced { border-color: rgba(159,53,45,.45); background: #fffdf8; color: var(--ink); box-shadow: 0 4px 15px rgba(68,43,27,.06); }
.transition-person.advanced span { color: var(--red); }
.transition-person.eliminated { border-color: #cbc5ba; background: #dedad1; color: #8d877d; filter: grayscale(1); }
.transition-person.eliminated span { color: #969086; }
.transition-empty { grid-column: 1/-1; margin: 0; padding: 24px; color: var(--muted); text-align: center; }
.transition-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
.transition-footer span { max-width: 680px; color: var(--muted); font-size: 12px; }

.result-head { text-align: center; }
.result-head .eyebrow { justify-content: center; }
.result-head h1 { max-width: none; margin-bottom: 12px; font-size: clamp(38px,6.5vw,72px); }
.champion { max-width: 460px; margin: 25px auto 32px; padding: 28px; border: 1px solid var(--gold); border-radius: 15px; background: linear-gradient(145deg,#fbf4e4,#efe0bf); box-shadow: var(--shadow); }
.champion span { color: #806428; font-size: 11px; font-weight: 800; letter-spacing: .19em; }
.champion strong { display: block; margin-top: 10px; color: var(--red); font-family: "Songti SC",SimSun,serif; font-size: 56px; }
.result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-bottom: 30px; }
.result-card { overflow: hidden; }
.result-section { padding: 22px; border-bottom: 1px solid var(--line); }
.result-section:last-child { border-bottom: 0; }
.result-section h3 { margin-bottom: 15px; font-size: 17px; }
.statistics-section { background: linear-gradient(135deg,rgba(251,246,234,.94),rgba(243,237,222,.72)); }
.statistics-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.statistics-heading h3 { margin: 0 0 6px; }
.statistics-heading p { margin: 0; color: var(--muted); font-size: 12px; }
.statistics-heading > span { padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 10px; white-space: nowrap; }
.statistics-personal { display: grid; grid-template-columns: minmax(140px,.35fr) 1fr; align-items: center; gap: 22px; margin-top: 18px; padding: 18px; border: 1px solid rgba(159,53,45,.25); border-radius: 10px; background: rgba(255,253,248,.84); }
.statistics-personal span { display: block; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
.statistics-personal strong { display: block; margin-top: 5px; color: var(--red); font-family: "Songti SC",STSong,SimSun,serif; font-size: 28px; }
.statistics-personal p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
.statistics-personal b { color: var(--ink); }
.statistics-leaders { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; margin-top: 12px; }
.statistics-leaders > div { min-height: 105px; padding: 15px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,253,248,.7); }
.statistics-leaders small { display: block; margin-bottom: 12px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; }
.statistics-leaders strong { display: block; color: var(--ink); font-family: "Songti SC",STSong,SimSun,serif; font-size: 18px; }
.statistics-leaders span { display: block; margin-top: 7px; color: var(--red); font-size: 11px; }
.statistics-notice { margin: 0; color: var(--muted); font-size: 13px; }
.statistics-retry { margin-top: 14px; }
.statistics-footnote { margin: 14px 0 0; color: var(--muted); font-size: 10px; line-height: 1.7; }
.summary-groups { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 9px; }
.summary-group { padding: 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.summary-group strong { display: block; margin-bottom: 8px; font-size: 12px; }
.summary-group span { display: inline-block; margin: 3px 5px 3px 0; color: var(--muted); font-size: 11px; }
.summary-group span.advanced { color: var(--forest); font-weight: 800; }

.bracket-wing {
  display: grid;
  grid-template-columns: repeat(var(--round-count), minmax(72px,1fr));
  gap: 10px;
}
.bracket-stage {
  position: relative;
  display: grid;
  grid-template-rows: 28px 1fr;
  min-width: 82px;
}
.bracket-stage-label {
  color: #887e6d;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .08em;
  text-align: center;
}
.bracket-stage-nodes {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  min-height: 0;
}
.bracket-node {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 35px;
  padding: 7px;
  border: 1px solid #c9c1b3;
  border-radius: 6px;
  background: rgba(231,226,216,.9);
  color: #8d877d;
  font-family: "Songti SC", STSong, SimSun, serif;
  font-size: 11.5px;
  white-space: nowrap;
}
.bracket-node.advanced {
  border-color: #a43b32;
  background: rgba(255,253,248,.97);
  color: var(--ink);
  font-weight: 700;
  box-shadow: 0 5px 18px rgba(32,28,22,.08);
}
.bracket-node b { color: #a43b32; font-family: inherit; font-size: 10px; }
.bracket-stage.left .bracket-node::after,
.bracket-stage.right .bracket-node::before {
  position: absolute;
  top: 50%;
  width: 11px;
  height: 1px;
  background: #bdb4a4;
  content: "";
}
.bracket-stage.left .bracket-node::after { right: -11px; }
.bracket-stage.right .bracket-node::before { left: -11px; }
.bracket-stage.left:last-child .bracket-node::after,
.bracket-stage.right:first-child .bracket-node::before { background: #a43b32; }
.bracket-center {
  align-self: center;
  padding: 28px 16px;
  border: 1px solid #9f352d;
  border-radius: 10px;
  background: #9f352d;
  color: white;
  text-align: center;
  box-shadow: 0 20px 50px rgba(92,31,26,.22);
}
.bracket-center .cup-mark {
  display: block;
  margin-bottom: 7px;
  color: #ead39b;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .14em;
}
.bracket-center small { display: block; color: #ecc9c5; font-size: 9px; letter-spacing: .2em; }
.bracket-center strong {
  display: block;
  margin: 17px 0 10px;
  font-family: "Songti SC", STSong, SimSun, serif;
  font-size: 34px;
}
.bracket-center i { color: #f0d8d4; font-size: 10px; font-style: normal; }
.bracket { display: flex; align-items: stretch; gap: 12px; width: max-content; min-width: 100%; }
.round-column { width: 210px; padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); }
.round-column h3 { margin: 0 0 11px; padding-bottom: 9px; border-bottom: 1px solid var(--line); font-size: 13px; }
.round-person { display: flex; justify-content: space-between; gap: 8px; padding: 6px 3px; border-bottom: 1px dotted #ded5c5; color: var(--muted); font-size: 12px; }
.round-person.advanced { color: var(--ink); font-weight: 750; }
.round-person .tick { color: var(--red); }
.champion-column { display: grid; min-height: 170px; place-content: center; text-align: center; }
.champion-column strong { color: var(--red); font-family: "Songti SC",SimSun,serif; font-size: 28px; }
.empty { grid-column: 1/-1; padding: 40px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; }
.footer { display: flex; justify-content: space-between; gap: 20px; padding: 20px clamp(18px,4vw,60px); border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.footer a { color: inherit; text-underline-offset: 3px; }
.confirm-overlay {
  position: fixed;
  z-index: 1000;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(25, 23, 19, .58);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.confirm-overlay[hidden] { display: none; }
.confirm-panel {
  width: min(100%, 430px);
  padding: 30px;
  border: 1px solid rgba(164, 59, 50, .38);
  border-radius: 14px;
  background: #fffdf8;
  box-shadow: 0 24px 70px rgba(25, 20, 15, .3);
  text-align: center;
}
.confirm-kicker {
  display: block;
  margin-bottom: 9px;
  color: var(--red);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .2em;
}
.confirm-panel h2 {
  margin: 0;
  color: var(--ink);
  font-family: "Songti SC", STSong, SimSun, serif;
  font-size: clamp(22px, 4vw, 28px);
}
.confirm-panel p { margin: 13px 0 24px; color: var(--muted); font-size: 14px; line-height: 1.75; }
.confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.confirm-actions button { min-height: 46px; }
.works-overlay {
  position: fixed;
  z-index: 1100;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(20,22,18,.68);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}
.works-overlay[hidden] { display: none; }
.works-panel {
  display: grid;
  grid-template-rows: auto minmax(0,1fr) auto;
  width: min(100%,820px);
  max-height: min(88vh,820px);
  overflow: hidden;
  border: 1px solid rgba(116,91,55,.35);
  border-radius: 16px;
  background: #fffdf8;
  box-shadow: 0 28px 90px rgba(18,17,14,.38);
}
.works-head { display: flex; justify-content: space-between; gap: 18px; padding: 25px 28px 18px; border-bottom: 1px solid var(--line); }
.works-kicker { color: var(--red); font-size: 10px; font-weight: 800; letter-spacing: .18em; }

      "content": "鹫翎金仆姑，燕尾绣蝥弧。独立扬新令，千营共一呼。"
    },
    {
      "title": "陈翃郎中北亭送侯钊侍御赋得带冰流歌",
      "author": "卢纶",
      "dynasty": "唐",
      "content": "溪中鸟鸣春景旦，一派寒冰忽开散。璧方镜员流不断，白云鳞鳞满河汉。叠处浅，旋处深。撇捩寒鱼上复沈，群鹅鼓舞扬清音。主人有客簪白笔，玉壶贮水光如一。持此赠君君饮之，圣君识君冰玉姿。"
    }
  ],
  "司空曙": [
    {
      "title": "喜外弟卢纶见宿",
      "author": "司空曙",
      "dynasty": "唐",
      "content": "静夜四无邻，荒居旧业贫。雨中黄叶树，灯下白头人。以我独沈久，愧君相见频。平生自有分，况是蔡家亲。"
    },
    {
      "title": "云阳馆与韩绅宿别",
      "author": "司空曙",
      "dynasty": "唐",
      "content": "故人江海别，几度隔山川。乍见翻疑梦，相悲各问年。孤灯寒照雨，湿竹暗浮烟。更有明朝恨，离杯惜共传。"
    }
  ],
  "李端": [
    {
      "title": "听筝",
      "author": "李端",
      "dynasty": "唐",
      "content": "鸣筝金粟柱，素手玉房前。欲得周郎顾，时时误拂弦。"
    },
    {
      "title": "拜新月",
      "author": "李端",
      "dynasty": "唐",
      "content": "开帘见新月，便即下阶拜。细语人不闻，北风吹裙带。"
    }
  ],
  "戴叔伦": [
    {
      "title": "兰溪棹歌",
      "author": "戴叔伦",
      "dynasty": "唐",
      "content": "凉月如眉挂柳湾，越中山色镜中看。兰溪三日桃花雨，半夜鲤鱼来上滩。"
    },
    {
      "title": "塞上曲二首 其一",
      "author": "戴叔伦",
      "dynasty": "唐",
      "content": "军门频纳受降书，一剑横行万里馀。汉祖谩夸娄敬策，却将公主嫁单于。"
    }
  ],
  "孟郊": [
    {
      "title": "游子吟",
      "author": "孟郊",
      "dynasty": "唐",
      "content": "慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。谁言寸草心，报得三春晖。"
    },
    {
      "title": "登科后",
      "author": "孟郊",
      "dynasty": "唐",
      "content": "昔日龌龊不足誇，今朝放荡思无涯。春风得意马蹄疾，一日看尽长安花。"
    }
  ],
  "韩愈": [
    {
      "title": "左迁至蓝关示侄孙湘",
      "author": "韩愈",
      "dynasty": "唐",
      "content": "一封朝奏九重天，夕贬潮州路八千。欲为圣朝除弊事，肯将衰朽惜残年。云横秦岭家何在，雪拥蓝关马不前。知汝远来应有意，好收吾骨瘴江边。"
    },
    {
      "title": "早春呈水部张十八员外二首 其一",
      "author": "韩愈",
      "dynasty": "唐",
      "content": "天街小雨润如酥，草色遥看近却无。最是一年春好处，绝胜烟柳满皇都。"
    }
  ],
  "张籍": [
    {
      "title": "秋思",
      "author": "张籍",
      "dynasty": "唐",
      "content": "洛阳城里见秋风，欲作归书意万重。忽恐匆匆说不尽，行人临发又开封。"
    },
    {
      "title": "节妇吟寄东平李司空师道",
      "author": "张籍",
      "dynasty": "唐",
      "content": "君知妾有夫，赠妾双明珠。感君缠绵意，系在红罗襦。妾家高楼连苑起，良人执戟明光里。知君用心如日月，事夫誓拟同生死。还君明珠双泪垂，何不相逢未嫁时。"
    }
  ],
  "王建": [
    {
      "title": "雨过山村",
      "author": "王建",
      "dynasty": "唐",
      "content": "雨里鸡鸣一两家，竹溪村路板桥斜。妇姑相唤浴蚕去，闲看中庭栀子花。"
    },
    {
      "title": "十五夜望月寄杜郎中",
      "author": "王建",
      "dynasty": "唐",
      "content": "中庭地白树栖鸦，冷露无声湿桂花。今夜月明人尽望，不知秋思在谁家。"
    }
  ],
  "白居易": [
    {
      "title": "琵琶行",
      "author": "白居易",
      "dynasty": "唐",
      "content": "浔阳江头夜送客，枫叶荻花秋索索。主人下马客在船，举酒欲饮无管弦。醉不成欢惨将别，别时茫茫江浸月。忽闻水上琵琶声，主人忘归客不发。寻声暗问弹者谁，琵琶声停欲语迟。移船相近邀相见，添酒回灯重开宴。千呼万唤始出来，犹抱琵琶半遮面。转轴拨弦三两声，未成曲调先有情。弦弦掩抑声声思，似诉平生不得意。低眉信手续续弹，说尽心中无限事。轻拢慢撚抹复挑，初为霓裳后六幺。大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。间关莺语花底滑，幽咽泉流水下滩。水泉冷涩弦疑绝，疑绝不通声暂歇。别有幽愁暗恨生，此时无声胜有声。银瓶乍破水浆迸，铁骑突出刀枪鸣。曲终收拨当心画，四弦一声如裂帛。东舟西舫悄无言，唯见江心秋月白。沈吟放拨插弦中，整顿衣裳起敛容。自言本是京城女，家在虾蟆陵下住。十三学得琵琶成，名蜀教坊第一部。曲罢曾教善才伏，妆成每被秋娘妒。五陵年少争缠头，一曲红绡不知数。钿头云篦击节碎，血色罗裙翻酒污。今年欢笑复明年，秋月春风等闲度。弟走从军阿姨死，暮去朝来颜色故。门前冷落鞍马稀，老大嫁作商人妇。商人重利轻别离，前月浮梁买茶去。去来江口守空船，绕船月明江水寒。夜深忽梦少年事，梦啼妆泪红阑干。我闻琵琶已叹息，又闻此语重唧唧。同是天涯沦落人，相逢何必曾相识。我从去年辞帝京，谪居卧病浔阳城。浔阳小处无音乐，终岁不闻丝竹声。住近湓江地低湿，黄芦苦竹绕宅生。其间旦暮闻何物，杜鹃啼血猿哀鸣。春江花朝秋月夜，往往取酒还独倾。岂无山歌与村笛，呕哑嘲哳难为听。今夜闻君琵琶语，如听仙乐耳暂明。莫辞更坐弹一曲，为君翻作琵琶行。感我此言良久立，却坐促弦弦转急。凄凄不似向前声，满座重闻皆掩泣。座中泣下谁最多，江州司马青衫湿。"
    },
    {
      "title": "琵琶",
      "author": "白居易",
      "dynasty": "唐",
      "content": "弦清拨剌语铮铮，背却残灯就月明。赖是心无惆怅事，不然争奈子弦声。"
    }
  ],
  "元稹": [
    {
      "title": "离思五首 其一",
      "author": "元稹",
      "dynasty": "唐",
      "content": "自爱残妆晓镜中，环钗谩篸绿丝丛。须臾日射燕脂颊，一朵红苏旋欲融。"
    },
    {
      "title": "遣悲怀三首 其一",
      "author": "元稹",
      "dynasty": "唐",
      "content": "谢公最小偏怜女，嫁与黔娄百事乖。顾我无衣搜画箧，泥他沽酒拔金钗。野蔬充膳甘长藿，落叶添薪仰古槐。今日俸钱过十万，与君营奠复营斋。"
    }
  ],
  "刘禹锡": [
    {
      "title": "酬乐天扬州初逢席上见赠",
      "author": "刘禹锡",
      "dynasty": "唐",
      "content": "巴山楚水凄凉地，二十三年弃置身。怀旧空吟闻篴赋，到乡翻似烂柯人。沈舟侧畔千帆过，病树前头万木春。今日听君歌一曲，暂凭杯酒长精神。"
    },
    {
      "title": "金陵五题 其二 乌衣巷",
      "author": "刘禹锡",
      "dynasty": "唐",
      "content": "朱雀桥边野草花，乌衣巷口夕阳斜。旧时王谢堂前燕，飞入寻常百姓家。"

  ],
  "柳宗元": [
    {
      "title": "江雪",
      "author": "柳宗元",
      "dynasty": "唐",
      "content": "千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。"
    },
    {
      "title": "渔翁",
      "author": "柳宗元",
      "dynasty": "唐",
      "content": "渔翁夜傍西岩宿，晓汲清湘燃楚竹。烟销日出不见人，欸乃一声山水绿。回看天际下中流，岩上无心云相逐。"
    }
  ],
  "贾岛": [
    {
      "title": "题李凝幽居",
      "author": "贾岛",
      "dynasty": "唐",
      "content": "闲居少邻并，草径入荒园。鸟宿池边树，僧敲月下门。过桥分野色，移石动云根。暂去还来此，幽期不负言。"
    },
    {
      "title": "寻隐者不遇",
      "author": "贾岛",
      "dynasty": "唐",
      "content": "松下问童子，言师采药去。只在此山中，云深不知处。"
    }
  ],
  "李贺": [
    {
      "title": "雁门太守行",
      "author": "李贺",
      "dynasty": "唐",
      "content": "黑云压城城欲摧，甲光向日金鳞开。角声满天秋色里，塞上燕脂凝夜紫。半卷红旗临易水，霜重鼓寒声不起。报君黄金台上意，提携玉龙为君死。"
    },
    {
      "title": "李凭箜篌引",
      "author": "李贺",
      "dynasty": "唐",
      "content": "吴丝蜀桐张高秋，空白凝云颓不流。江娥啼竹素女愁，李凭中国弹箜篌。昆山玉碎凤皇叫，芙蓉泣露香兰笑。十二门前融冷光，二十三丝动紫皇。女娲鍊石补天处，石破天惊逗秋雨。梦入坤山教神妪，老鱼跳波瘦蛟舞。吴质不眠倚桂树，露脚斜飞湿寒兔。"
    }
  ],
  "卢仝": [
    {
      "title": "走笔谢孟谏议寄新茶",
      "author": "卢仝",
      "dynasty": "唐",
      "content": "日高丈五睡正浓，军将打门惊周公。口云谏议送书信，白绢斜封三道印。开缄宛见谏议面，手阅月团三百片。闻道新年入山里，蛰虫惊动春风起。天子须尝阳羡茶，百草不敢先开花。仁风暗结珠琲瓃，先春抽出黄金芽。摘鲜焙芳旋封裹，至精至好且不奢。至尊之馀合王公，何事便到山人家。柴门反关无俗客，纱帽笼头自煎吃。碧云引风吹不断，白花浮光凝椀面。一椀喉吻润，两椀破孤闷。三椀搜枯肠，唯有文字五千卷。四椀发轻汗，平生不平事。尽向毛孔散，五椀肌骨清。六椀通仙灵，七椀吃不得也。唯觉两腋习习清风生，蓬莱山，在何处？玉川子，乘此清风欲归去。山上群仙司下土，地位清高隔风雨。安得知百万亿苍生命，堕在巅崖受辛苦。便为谏议问苍生，到头还得苏息否。"
    },
    {
      "title": "有所思",
      "author": "卢仝",
      "dynasty": "唐",
      "content": "当时我醉美人家，美人颜色娇如花。今日美人弃我去，青楼珠箔天之涯。天涯娟娟姮娥月，三五二八盈又缺。翠眉蝉鬓生别离，一望不见心断绝。心断绝，几千里。梦中醉卧巫山云，觉来泪滴湘江水。湘江两岸花木深，美人不见愁人心。含愁更奏绿绮琴，调高弦绝无知音。美人兮美人，不知为暮雨兮为朝云。相思一夜梅花发，忽到窗前疑是君。"
    }
  ],
  "李绅": [
    {
      "title": "悯农二首 其一",
      "author": "李绅",
      "dynasty": "唐",
      "content": "春种一粒粟，秋成万颗子。四海无闲田，农夫犹饿死。"
    },
    {
      "title": "上党奏庆云见",
      "author": "李绅",
      "dynasty": "唐",
      "content": "飞龙久驭宇，真气尚兴云。五色传嘉瑞，千龄表圣君。从风忽萧索，依汉更氛氲。影彻天初霁，光鲜日未曛。表祥近自远，垂化聚还分。宁作无依者，空传陶令文。"
    }
  ],
  "薛涛": [

      "author": "薛涛",
      "dynasty": "唐",
      "content": "水国蒹葭夜有霜，月寒山色共苍苍。谁言千里自今夕，离梦杳如关塞长。"

    {
      "title": "春望词四首 其一",
      "author": "薛涛",
      "dynasty": "唐",
      "content": "花开不同赏，花落不同悲。欲问相思处，花开花落时。"
    }
  ],

      "dynasty": "唐",

  "李商隐": [

  ],
  "温庭筠": [
    {

      "author": "温庭筠",
      "dynasty": "唐",
      "content": "晨起动征铎，客行悲故乡。鸡声茅店月，人迹板桥霜。槲叶落山路，枳花明驿墙。因思杜陵梦，凫雁满回塘。"

      "author": "温庭筠",
      "dynasty": "唐",

    }
  ],
  "许浑": [

    }
  ],
  "赵嘏": [
    {
      "title": "长安晚秋",
      "author": "赵嘏",
      "dynasty": "唐",
      "content": "云物凄凉拂曙流，汉家宫阙动高秋。残星几点雁横塞，长笛一声人倚楼。紫艳半开篱菊静，红衣落尽渚莲愁。鲈鱼正美不归去，空戴南冠学楚囚。"

  ],
  "皇甫松": [
    {
      "title": "采莲子 其二",
      "author": "皇甫松",
      "dynasty": "唐",
      "content": "船动湖光滟滟秋，贪看年少信船流。无端隔水抛莲子，遥被人知半日羞。"
    },
    {
      "title": "竹枝",
      "author": "皇甫松",
      "dynasty": "唐",
      "content": "槟榔花发鹧鸪啼，雄飞烟瘴雌亦飞。木棉花尽荔支垂，千花万花待郎归。芙蓉并蒂一心连，花侵槅子眼应穿。筵中蜡烛泪珠红，合欢桃核两人同。斜江风起动横波，劈开莲子苦心多。山头桃花谷底杏，两花窈窕遥相映。"
    }
  ],
  "皮日休": [
    {
      "title": "汴河怀古二首 其一",
      "author": "皮日休",
      "dynasty": "唐",
      "content": "万艘龙舸绿丝间，载到扬州尽不还。应是天教开汴水，一千馀里地无山。"
    },
    {
      "title": "正乐府十篇 其二 橡媪叹",
      "author": "皮日休",
      "dynasty": "唐",
      "content": "秋深橡子熟，散落榛芜冈。伛伛黄发媪，拾之践晨霜。移时始盈掬，尽日方满筐。几曝复几蒸，用作三冬粮。山前有熟稻，紫穗袭人香。细获又精舂，粒粒如玉珰。持之纳于官，私室无仓箱。如何一石馀，只作五斗量。狡吏不畏刑，贪官不避赃。农时作私债，农毕归官仓。自冬及于春，橡实诳饥肠。吾闻田成子，诈仁犹自王。吁嗟逢橡媪，不觉泪沾裳。"
    }
  ],
  "陆龟蒙": [
    {
      "title": "和袭美木兰后池三咏 白莲",
      "author": "陆龟蒙",
      "dynasty": "唐",
      "content": "素蘤多蒙别艳欺，此花真合在瑶池。还应有恨无人觉，月晓风清欲堕时。"
    },
    {
      "title": "杂曲歌辞 别离曲",
      "author": "陆龟蒙",
      "dynasty": "唐",
      "content": "丈夫非无泪，不洒离别间。杖剑对尊酒，耻为游子颜。蝮蛇一螫手，壮士即解腕。所志在功名，离别何足叹。"
    }
  ],
  "罗隐": [
    {
      "title": "蜂",
      "author": "罗隐",
      "dynasty": "唐",
      "content": "不论平地与山尖，无限风光尽被占。采得百花成蜜后，为谁辛苦为谁甜。"
    },
    {
      "title": "自遣",
      "author": "罗隐",
      "dynasty": "唐",
      "content": "得即高歌失即休，多愁多恨亦悠悠。今朝有酒今朝醉，明日愁来明日愁。"
    }
  ],
  "杜荀鹤": [
    {
      "title": "山中寡妇",
      "author": "杜荀鹤",
      "dynasty": "唐",
      "content": "夫因兵死守蓬茅，麻苧衣衫鬓发焦。桑柘废来犹纳税，田园荒后尚徵苗。时挑野菜和根煮，旋斫生柴带叶烧。任是深山更深处，也应无计避征徭。"
    },
    {
      "title": "小松",
      "author": "杜荀鹤",
      "dynasty": "唐",
      "content": "自小刺头深草里，而今渐觉出蓬蒿。时人不识凌云木，直待凌云始道高。"
    }
  ],
  "韦庄": [
    {
      "title": "台城",
      "author": "韦庄",
      "dynasty": "唐",
      "content": "江雨霏霏江草齐，六朝如梦鸟空啼。无情最是台城柳，依旧烟笼十里堤。"
    },
    {
      "title": "菩萨蛮 其一",
      "author": "韦庄",
      "dynasty": "唐",
      "content": "红楼别夜堪惆怅，香灯半卷流苏帐。残月出门时，美人和泪辞。琵琶金翠羽，弦上黄莺语。劝我早归家，绿窗人似花。"
    }
  ],
  "司空图": [
    {
      "title": "退栖",
      "author": "司空图",
      "dynasty": "唐",
      "content": "宦游萧索为无能，移住中条最上层。得剑乍如添健仆，亡书久似失良朋。燕昭不是空怜马，支遁何妨亦爱鹰。自此致身绳检外，肯教世路日兢兢。"
    },
    {
      "title": "题休休亭",
      "author": "司空图",
      "dynasty": "唐",
      "content": "咄，诺。休休休，莫莫莫。伎两虽多性灵恶，赖是长教闲处著。休休休，莫莫莫。一局棋，一炉药。天意时情可料度，白日偏催快活人。黄金难买堪骑鹤，若曰尔何能，荅言耐辱莫。"
    }
  ],
  "韩偓": [
    {
      "title": "已凉",
      "author": "韩偓",
      "dynasty": "唐",
      "content": "碧阑干外绣帘垂，猩血屏风画折枝。八尺龙须方锦褥，已凉天气未寒时。"
    },
    {
      "title": "安贫",
      "author": "韩偓",
      "dynasty": "唐",
      "content": "手风慵展一行书，眼暗休寻九局图。窗里日光飞野马，案头筠管长蒲庐。谋身拙为安蛇足，报国危曾捋虎须。举世可能无默识，未知谁拟试齐竽。"
    }
  ],
  "聂夷中": [
    {
      "title": "咏田家",
      "author": "聂夷中",
      "dynasty": "唐",
      "content": "二月卖新丝，五月粜新谷。医得眼前疮，剜却心头肉。我愿君王心，化作光明烛。不照绮罗筵，只照逃亡屋。"
    },
    {
      "title": "公子行二首 其一",
      "author": "聂夷中",
      "dynasty": "唐",
      "content": "汉代多豪族，恩深益骄逸。走马踏杀人，街吏不敢诘。红楼宴青春，数里望云蔚。金缸焰胜昼，不畏落晖疾。美人尽如月，南威莫能匹。芙蓉自天来，不向水中出。飞琼奏云和，碧箫吹凤质。唯恨鲁阳死，无人驻白日。"
    }
  ],
  "郑谷": [
    {
      "title": "鹧鸪",
      "author": "郑谷",
      "dynasty": "唐",
      "content": "暖戏烟芜锦翼齐，品流应得近山鸡。雨昏青草湖边过，花落黄陵庙里啼。游子乍闻征袖湿，佳人才唱翠眉低。相呼相应湘江阔，苦竹丛深春日西。"
    },
    {
      "title": "淮上与友人别",
      "author": "郑谷",
      "dynasty": "唐",
      "content": "扬子江头杨柳春，杨花愁杀渡江人。数声风笛离亭晚，君向潇湘我向秦。"
    }
  ],
  "贯休": [
    {
      "title": "献钱尚父",
      "author": "贯休",
      "dynasty": "唐",
      "content": "贵逼人来不自由，龙骧凤翥势难收。满堂花醉三千客，一剑霜寒十四州。鼓角揭天嘉气冷，风涛动地海山秋。东南永作金天柱，谁羡当时万户侯。"
    },
    {
      "title": "春送僧",
      "author": "贯休",
      "dynasty": "唐",
      "content": "蜀魄关关花雨深，送师冲雨到江浔。不能更折江头柳，自有青青松柏心。"
    }
  ],
  "齐己": [
    {
      "title": "早梅",
      "author": "齐己",
      "dynasty": "唐",
      "content": "万木冻欲折，孤根暖独回。前村深雪里，昨夜一枝开。风遰幽香去，禽窥素艳来。明年如应律，先发映春台。"
    },
    {
      "title": "剑客",
      "author": "齐己",
      "dynasty": "唐",
      "content": "拔剑绕残樽，歌终便出门。西风满天雪，何处报人恩。勇死寻常事，轻雠不足论。翻嫌易水上，细碎动离魂。"
    }
  ],
  "鱼玄机": [
    {
      "title": "赠邻女",
      "author": "鱼玄机",
      "dynasty": "唐",
      "content": "羞日遮罗袖，愁春懒起妆。易求无价宝，难得有心郎。枕上潜垂泪，花间暗断肠。自能窥宋玉，何必恨王昌。"
    },
    {
      "title": "江陵愁望寄子安",
      "author": "鱼玄机",
      "dynasty": "唐",
      "content": "枫叶千枝复万枝，江桥掩映暮帆迟。忆君心似西江水，日夜东流无歇时。"
    }
  ],
  "上官婉儿": [
    {
      "title": "游长宁公主流杯池二十五首 其十三",
      "author": "上官婉儿",
      "dynasty": "唐",
      "content": "玉环腾远创，金埒荷殊荣。弗玩珠玑饰，仍留仁智情。凿山便作室，凭树即为楹。公输与班尔，从此遂韬声。"
    },
    {
      "title": "驾幸三会寺应制",
      "author": "上官婉儿",
      "dynasty": "唐",
      "content": "释子谈经处，轩臣刻字留。故台遗老识，残简圣皇求。驻跸怀千古，开襟望九州。四山缘塞合，二水夹城流。宸翰陪瞻仰，天杯接献酬。太平词藻盛，长愿纪鸿休。"
    }
  ],
  "冯延巳": [
    {
      "title": "鹊踏枝",
      "author": "冯延巳",
      "dynasty": "唐",
      "content": "烦恼韶光能几许，肠断魂消，看却春还去。只喜墙头灵鹊语，不知青鸟全相误。心若垂杨千万缕，水阔花飞，梦断巫山路。开眼新愁无问处，珠帘锦帐相思否？"
    },
    {
      "title": "谒金门 其三",
      "author": "冯延巳",
      "dynasty": "唐",
      "content": "风乍起，吹皱一池春水。闲引鸳鸯芳径里，手挼红杏蕊。斗鸭阑干独倚，碧玉搔头斜坠。终日望君君不至，举头闻鹊喜。"
    }
  ],
  "李璟": [
    {
      "title": "摊破浣溪沙 其一",
      "author": "李璟",
      "dynasty": "唐",
      "content": "菡萏香销翠叶残，西风愁起绿波间。还与韶光共憔悴，不堪看。细雨梦回鸡塞远，小楼吹彻玉笙寒。多少泪珠何限恨，倚阑干。"
    },
    {
      "title": "保大五年元日大雪同太弟景遂汪王景逖齐王景逵进士李建勋中书徐铉勤政殿学士张义方登楼赋",
      "author": "李璟",
      "dynasty": "唐",
      "content": "珠帘高卷莫轻遮，往往相逢隔岁华。春气昨宵飘律管，东风今日放梅花。素姿好把芳姿掩，落势还同舞势斜。坐有宾朋尊有酒，可怜清味属侬家。"
    }
  ],
  "李煜": [
    {
      "title": "虞美人 其一",
      "author": "李煜",
      "dynasty": "唐",
      "content": "风回小院庭芜绿，柳眼春相续。凭阑半日独无言，依旧竹声新月，似当年。笙歌未散尊罍在，池面冰初解。烛明香暗画楼深，满鬓清霜残雪，思难禁。"
    },
    {
      "title": "浪淘沙令 其一",
      "author": "李煜",
      "dynasty": "唐",
      "content": "帘外雨潺潺，春意阑珊。罗衾不耐五更寒，梦里不知身是客，一晌贪欢。独自暮凭阑，无限江山。别时容易见时难，流水落花春去也，天上人间。"
    }
  ],
  "孙光宪": [
    {
      "title": "谒金门",
      "author": "孙光宪",
      "dynasty": "唐末宋初",
      "content": "留不得，留得也应无益。白纻春衫如雪色，扬州初去日。轻别离，甘抛掷，江上满帆风疾。却羡綵鸳三十六，孤鸾还一只。"
    },
    {
      "title": "浣溪沙 其十",
      "author": "孙光宪",
      "dynasty": "唐末宋初",
      "content": "风撼芳菲满院香，四帘慵卷日初长，鬓云垂枕向微锽。春梦未成愁寂寂，佳期难会信茫茫。万般心，千点泪，泣兰堂。"
    }
  ],
  "欧阳炯": [
    {
      "title": "南乡子 其一",
      "author": "欧阳炯",
      "dynasty": "唐",
      "content": "嫩草如烟，石榴花发海南天。日暮江亭春影渌，鸳鸯浴，水远山长看不足。"
    },
    {
      "title": "凤楼春",
      "author": "欧阳炯",
      "dynasty": "唐",
      "content": "凤髻绿云丛，深掩房栊。锦书通，梦中相见觉来慵。匀面泪，脸珠融。因想玉郎何处去，对淑景谁同。小楼中，春思无穷。倚阑凝望，闇牵愁绪，柳花飞起东风。斜日照帘，罗幌香冷粉屏空。海棠零落，莺语残红。"
    }
  ],
  "牛希济": [
    {
      "title": "生查子 其一",
      "author": "牛希济",
      "dynasty": "唐",
      "content": "春山烟欲收，天澹星稀小。残月脸边明，别泪临清晓。语已多，情未了，回首犹重道。记得绿罗裙，处处怜芳草。"
    },
    {
      "title": "临江仙 其一",
      "author": "牛希济",
      "dynasty": "唐",
      "content": "峭碧参差十二峰，冷烟寒树重重。瑶姬宫殿是仙踪。金炉珠帐，香霭昼偏浓。一自楚王惊梦断，人间无路相逢。至今云雨带愁容。月斜江上，征棹动晨钟。"
    }
  ],
  "李珣": [
    {
      "title": "南乡子 其一",
      "author": "李珣",
      "dynasty": "唐",
      "content": "烟漠漠，雨凄凄，岸花零落鹧鸪啼。远客扁舟临野渡，思乡处，潮退水平春色暮。"
    },
    {
      "title": "中兴乐",
      "author": "李珣",
      "dynasty": "唐",
      "content": "后庭寂寂日初长，翩翩蝶舞红芳。绣帘垂地，金鸭无香，谁知春思如狂，忆萧郎。等闲一去，程遥信断，五岭三湘。休开鸾镜学宫妆，可能更理笙簧。倚屏凝睇，泪落成行，手寻裙带鸳鸯，暗思量。忍孤前约，教人花貌，虚老风光。"
    }
  ],
  "顾夐": [
    {
      "title": "诉衷情 其二",
      "author": "顾夐",
      "dynasty": "唐",
      "content": "永夜抛人何处去，绝来音。香阁掩，眉敛，月将沈。争忍不相寻，怨孤衾。换我心，为你心，始知相忆深。"
    },
    {
      "title": "荷叶杯 其一",
      "author": "顾夐",
      "dynasty": "唐",
      "content": "春尽小庭花落，寂寞，凭槛敛双眉。忍教成病忆佳期，知摩知，知摩知。"
    }
  ],
  "和凝": [
    {
      "title": "菩萨蛮",
      "author": "和凝",
      "dynasty": "唐",
      "content": "越梅半拆轻寒里，冰清澹薄笼蓝水。暖觉杏梢红，游丝狂惹风。闲阶莎径碧，远梦犹堪惜。离恨又迎春，相思难重陈。"
    },
    {
      "title": "江城子 其一",
      "author": "和凝",
      "dynasty": "唐",
      "content": "初夜含娇入洞房，理残妆，柳眉长。翡翠屏中，亲爇玉炉香。整顿金钿呼小玉，排红烛，待潘郎。"
    }
  ],
  "王禹偁": [
    {
      "title": "村行",
      "author": "王禹偁",
      "dynasty": "宋",
      "content": "马穿山径菊初黄，信马悠悠野兴长。万壑有声含晚籁，数峰无语立斜阳。棠梨叶落胭脂色，荞麦花开白雪香。何事吟余忽惆怅，村桥原树似吾乡。"
    },
    {
      "title": "点绛唇·感兴",
      "author": "王禹偁",
      "dynasty": "宋",
      "content": "雨恨云愁，江南依旧称佳丽。水村渔市，一缕孤烟细。天际征鸿，遥认行如缀。平生事，此时凝睇，谁会凭栏意。"
    }
  ],
  "林逋": [
    {
      "title": "山园小梅二首 其二",
      "author": "林逋",
      "dynasty": "宋",
      "content": "剪绡零碎点酥乾，向背稀稠画亦难。日薄从甘春至晚，霜深应怯夜来寒。澄鲜只共邻僧惜，冷落犹嫌俗客看。忆著江南旧行路，酒旗斜拂堕吟鞍。"
    },
    {
      "title": "林间石",
      "author": "林逋",
      "dynasty": "宋",
      "content": "入夜跏趺多待月，移时箕踞为看山。苔生晚片应知静，云动秋根合见闲。瘦鹤独随行药后，高僧相对试茶间。疏篁百本松千尺，莫怪频频此往还。"
    }
  ],
  "寇准": [
    {
      "title": "江南春",
      "author": "寇准",
      "dynasty": "宋",
      "content": "波渺渺，柳依依。孤村芳草远，斜日杏花飞。江南春尽离肠断，蘋满汀洲人未归。"

    {
      "title": "陶者",
      "author": "梅尧臣",
      "dynasty": "宋",
      "content": "陶尽门前土，屋上无片瓦。十指不沾泥，鳞鳞居大厦。"
    }
  ],

      "author": "苏舜钦",

  ],

      "dynasty": "宋",
      "content": "江上往来人，但爱鲈鱼美。君看一叶舟，出没风波里。"

  ],

  ],
  "张先": [

  "柳永": [

  ],

      "content": "颢气中流转，烟光四周遭。层波碧离离，秋色寒滔滔。泠然乘风游，托身任毫毛。仰观天垂象，旁见林露梢。山移舟向背，目荡心飘摇。北望千帆走，灿若组紃交。五老云外笑，人世心魂劳。明当接匡君，举手为我招。"

  ],
  "厉鹗": [
    {
      "title": "百字令  月夜过七里滩光景奇绝歌此调几令众山皆响",

      "dynasty": "清",
      "content": "秋光今夜，向桐江、为写当年高躅。风露皆非人世有，自坐船头吹竹。万籁生山，一星在水，鹤梦疑重续。挐音遥去，西岩渔父初宿。心忆汐社沈埋，清狂不见，使我形容独。寂寂冷萤三四点，穿破前湾茅屋。林净藏烟，峰危限月，帆影摇空绿。随流飘荡，白云还卧深谷。"

      "author": "厉鹗",

  ],

      "content": "往余游京华，郑君过我邸。告言子沈子，诗亦同光体。杂然见赠答，色味若粢醴。十年始会面，辍乐正读礼。从之索旧作，发箧空如洗。能者不自珍，翻悔笔轻泚。我言诗教微，百喙乃争启。风雅道殆丧，庞言天方癠。内轻感外重，怨诽遂丑诋。何人抱微尚，不绝如追蠡。宋唐皆贤劫，胜国空祖祢。当涂逮典午，导江仅至澧。先生特自牧，颇谓语中綮。年来积怀抱，发泄出根柢。虽肆百态妍，石濑下见底。我虽不晓事，老去目未眯。谅有古性情，汩汩任有瀰。"
    },
    {
      "title": "洞仙歌",
      "author": "陈衍",
      "dynasty": "清末民国初",
      "content": "人天九变，趁华鬘璎珞。玉气珠光尚如昨。彩云留记取，周昉屏风宜称处，弦柱华年寄托。年时曾待阙。脸际眉山，盼断妆台扇初却。店里定婚人，不道重来，莫金缕衣裳耽搁。只除裹、春云碧琉璃，肯钿尺裁量，秘辛轻错。"
    }
  ],
  "沈曾植": [
    {
      "title": "还家杂诗 其二",
      "author": "沈曾植",
      "dynasty": "清末民国初",
      "content": "水竹交蓊蔚，柁移入支泾。春阴澹原隰，遥见孤花明。蚕候百室静，阡陌希人行。林阴见犬卧，日午闻鸡鸣。妇智敬无旷，田更勤得生。幸无街弹室，不解闾师争。淳俗偶存在，儿童乐柴荆。即此是瀼滨，潺潺水乐声。"
    },
    {
      "title": "简西岩老人 其一",
      "author": "沈曾植",
      "dynasty": "清末民国初",
      "content": "海日楼头倚夕阳，春秋直为蟪蛄忙。远人如杌忽移树，深草隐花微度香。水位星摇占害气，金神气伏避炎方。奇胲刑德非无意，会与闾昭一审详。"
    }
  ],
  "黄遵宪": [
    {
      "title": "海行杂感 其六",
      "author": "黄遵宪",
      "dynasty": "清",
      "content": "星星世界遍诸天，不计三千与大千。倘亦乘槎中有客，回头望我地球圆。"
    },
    {
      "title": "杂感 其一",
      "author": "黄遵宪",
      "dynasty": "清",
      "content": "少小诵《诗》、《书》，开卷动龃龉。古文与今言，旷若设疆圉。竟如置重译，象胥通蛮语。父师递流转，惯习忘其故。我生千载后，语音杂伧楚。今日六经在，笔削出邹鲁。欲读古人书，须识古语古。唐宋诸大儒，纷纷作笺注。每将后人心，探索到三五。性天古所无，器物目未睹。妄言足欺人，数典既忘祖。燕相说郢书，越人戴章甫。多歧道益亡，举烛乃笔误。"

  "康有为": [

      "title": "出都留别诸公",
      "author": "康有为",
      "dynasty": "清末民国初",
      "content": "天龙作骑万灵从，独立飞来缥缈峰。怀抱芳馨兰一握，纵横宙合雾千重。眼中战国成争鹿，海内人才孰卧龙？抚剑长号归去也，千山风雨啸青锋。"
    },
    {
      "title": "秋登越王台",
      "author": "康有为",
      "dynasty": "清末民国初",
      "content": "秋风立马越王台，混混蛇龙最可哀。十七史从何说起，三千劫几历轮回。腐儒心事呼天问，大地山河跨海来。临睨飞云横八表，岂无倚剑叹雄才！"
    }
  ],
  "梁启超": [
    {
      "title": "读陆放翁集",
      "author": "梁启超",
      "dynasty": "清末民国初",
      "content": "辜负胸中十万兵，百无聊赖以诗鸣。谁怜爱国千行泪，说到胡尘意不平。"

    {
      "title": "太平洋遇雨",
      "author": "梁启超",
      "dynasty": "清末民国初",
      "content": "一雨纵横亘二洲，浪淘天地入东流。却余人物淘难尽，又挟风雷作远游。"

  "谭嗣同": [

      "dynasty": "清",
      "content": "望门投止思张俭，忍死须臾待杜根。我自横刀向天笑，去留肝胆两昆仑。"

    {

  "丘逢甲": [
    {

      "dynasty": "清",

    {
      "title": "元夕无月 其一",
      "author": "丘逢甲",
      "dynasty": "清",
      "content": "满城灯市荡春烟，宝月沉沉隔海天。看到六鳌仙有泪，神山沦没已三年。"

  ],
  "秋瑾": [
    {
      "title": "对酒",
      "author": "秋瑾",
      "dynasty": "近现代",
      "content": "不惜千金买宝刀，貂裘换酒也堪豪。一腔热血勤珍重，洒去犹能化碧涛。"
    },
    {
      "title": "满江红",
      "author": "秋瑾",
      "dynasty": "近现代",
      "content": "肮脏尘寰，问几个、男儿英哲！算只有蛾眉队里，时闻豪杰。良玉勋名襟上泪，云英事业心头血。醉摩挲、长剑作龙吟，声悲咽。自由香，常思爇；家国恨，何时雪。劝吾侪今日，各宜努力。振拔须思安种类，繁华莫但誇衣玦。算弓鞋三寸太无为，宜改革。"
    }
  ],
  "苏曼殊": [
    {
      "title": "本事诗",
      "author": "苏曼殊",
      "dynasty": "清末近现代初",
      "content": "相怜病骨轻于蝶，梦入罗浮万里云。赠尔多情诗一卷，他年重拾石榴裙。"
    },
    {
      "title": "过若松町有感",
      "author": "苏曼殊",
      "dynasty": "清末近现代初",
      "content": "孤灯引梦记朦胧，风雨邻庵夜半钟。我再来时人已去，涉江谁为采芙蓉？"
    }
  ],
  "王鹏运": [
    {
      "title": "满江红",
      "author": "王鹏运",
      "dynasty": "清",
      "content": "笑揖青山，便从此、云归也得。试认取、半塘东畔，峰峦闟辟。陶令未开三益径，扈君早办千秋宅。更无烦、记莂告山灵，应相识。碑漫拟，征西勒。冢未近，要离侧。只随宜呼取，酒人诗伯。地下竟偿偕隐愿，区中何日劳生息。和长吟、神往白杨风，秋萧瑟。"
    },
    {
      "title": "鹊踏枝 其一",
      "author": "王鹏运",
      "dynasty": "清",
      "content": "落蕊残阳红片片。懊恨比邻，尽日流莺转。似雪杨花吹又散，东风无力将春限。慵把香罗裁便面。换到轻衫，欢意垂垂浅。襟上泪痕犹隐见，笛声催按梁州遍。"
    }
  ],
  "文廷式": [
    {
      "title": "水龙吟",
      "author": "文廷式",
      "dynasty": "清",
      "content": "落花飞絮茫茫，古来多少愁人意。游丝窗隙，惊飙树底，暗移人世。一梦醒来，起看明镜，二毛生矣。有葡萄美酒，芙蓉宝剑，都未称，平生志。我是长安倦客，二十年、软红尘里。无言独对，青灯一点，神游天际。海水浮空，空中楼阁，万重苍翠。待骖鸾归去，层霄回首，又西风起。"
    },
    {
      "title": "祝英台近",
      "author": "文廷式",
      "dynasty": "清",
      "content": "剪鲛绡，传燕语，黯黯碧云暮。愁望春归，春到更无绪。园林红紫千千，放教狼藉，休但怨连番风雨。谢桥路，十载钿车，惊心旧游误。玉佩尘生，此恨奈何许。倚楼极目天涯，天涯尽处，算祇有濛濛飞絮。"
    }
  ],
  "况周颐": [
    {
      "title": "浣溪沙",
      "author": "况周颐",
      "dynasty": "清",
      "content": "莫遣歌尘到扇边。苕华珍重绿琅玕。篁溪高矩至今传。画铁凝姿成幻渺，镌筠著骨见芳坚。笑他刻楮几经年。"
    },
    {
      "title": "减字浣溪沙",
      "author": "况周颐",
      "dynasty": "清",
      "content": "雁后霜前百不堪。飘镫何意得深论。赁庐天与近花庵。只为移情来海上，便须连句仿城南。人天慧业好同参。"
    }
  ],
  "朱祖谋": [
    {
      "title": "鹧鸪天",
      "author": "朱祖谋",
      "dynasty": "清末民国初",
      "content": "梦里云屏度几重。兰期犹暖旧欢丛。镫飘绣扇花如睡，歌咽金船酒不醲。春寂寂，恨悤悤。凤城凉信又归鸿。缄情欲托天边月，知道高楼雨是风。"
    },
    {
      "title": "鹧鸪天 九日丰宜门外过裴村别业",
      "author": "朱祖谋",
      "dynasty": "清末民国初",
      "content": "野水斜桥又一时。愁心空诉故鸥知。凄迷南郭垂鞭过，清苦西峰侧帽窥。新雪涕，旧弦诗。愔愔门馆蝶来稀。红萸白菊浑无恙，只是风前有所思。"
    }
  ],
  "王国维": [
    {
      "title": "蝶恋花",
      "author": "王国维",
      "dynasty": "清末近现代初",
      "content": "谁道江南春事了，废苑朱藤，开尽无人到。高柳数行临古道，一藤红遍千枝杪。冉冉赤云将绿绕，回首林间，无限斜阳好。若是春归归合早，馀春只搅人怀抱。"
    },
    {
      "title": "采桑子",
      "author": "王国维",
      "dynasty": "清末近现代初",
      "content": "高城鼓动兰釭灺，睡也还醒。醉也还醒。忽听孤鸿三两声。人生只似风前絮，欢也零星。悲也零星。都作连江点点萍。"
    }
  ]
};

</script>
  <script>
(function () {
  "use strict";

  const data = window.POET_DATA;
  const representativeWorks = window.POET_WORKS || {};
  const app = document.getElementById("app");
  const resumeButton = document.querySelector(".resume-button");
  const STORAGE_KEY = "shijie-cup-v4";
  const allPeriods = new Set(data.periodOrder);
  const allGenres = new Set(["poetry", "ci"]);

  let mode = "default";
  let selectedPeriods = new Set(allPeriods);
  let selectedGenres = new Set(allGenres);
  let selectedCustom = new Set(data.poets.map((poet) => poet.id));
  let searchText = "";
  let tournament = null;
  let stageSelection = new Set();
  let undoStack = [];
  let restartTrigger = null;
  let worksTrigger = null;
  let statisticsState = { status: "idle", data: null, error: "" };

  const escapeHtml = (value) =>
    String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

  const shuffle = (items) => {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };

  const topRanked = (items, count) =>
    [...items]
      .sort((a, b) => (b.score - a.score) || a.name.localeCompare(b.name, "zh-CN"))
      .slice(0, count);

  const unique = (items) => {
    const seen = new Set();
    return items.filter((item) => {
      if (seen.has(item.id)) return false;
      seen.add(item.id);
      return true;
    });
  };

  function anonymousSubmissionId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
    return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
  }

  function placementsFromTournament(state) {
    const rounds = state?.knockout?.rounds || [];
    const finalMatch = rounds.at(-1)?.matches?.[0];
    const champion = state?.champion;
    if (!champion || !finalMatch?.a || !finalMatch?.b) return null;
    const runnerUp = finalMatch.a.id === champion.id ? finalMatch.b : finalMatch.a;
    const semifinalRound = [...rounds].reverse().find((round) => unique(round.entrants || []).length === 4);
    const semifinalists = unique(semifinalRound?.entrants || []);
    if (semifinalists.length !== 4 || !semifinalists.some((poet) => poet.id === champion.id) || !semifinalists.some((poet) => poet.id === runnerUp.id)) return null;
    return { champion, runnerUp, semifinalists };
  }

  function resultPlacements() {
    return placementsFromTournament(tournament);
  }

  function leaderMarkup(items) {
    if (!items?.length) return "暂无数据";
    const names = items.map((item) => escapeHtml(item.name)).join("、");
    const first = items[0];
    return `<strong>${names}</strong><span>${first.count}份 · ${first.percent}%</span>`;
  }

  function statisticsMarkup() {
    if (statisticsState.status === "loading" || statisticsState.status === "idle") {
      return `<section class="result-section statistics-section" data-statistics><h3>全站结果统计</h3><p class="statistics-notice">正在匿名提交本次名次并读取累计结果……</p></section>`;
    }
    if (statisticsState.status === "error") {
      return `<section class="result-section statistics-section" data-statistics><h3>全站结果统计</h3><p class="statistics-notice">${escapeHtml(statisticsState.error)}</p><button class="quiet-button statistics-retry" type="button" data-action="retry-statistics">重新加载</button></section>`;
    }
    const stats = statisticsState.data;
    return `<section class="result-section statistics-section" data-statistics>
      <div class="statistics-heading"><div><h3>全站结果统计</h3><p>自统计功能上线后，已收录 ${stats.total} 份完整结果。</p></div><span>仅提交冠军、亚军与四强</span></div>
      <div class="statistics-personal">
        <div><span>你的冠军</span><strong>${escapeHtml(stats.selected.champion)}</strong></div>
        <p>其中 <b>${stats.selected.championCount}份（${stats.selected.championPercent}%）</b> 的冠军同样是${escapeHtml(stats.selected.champion)}；<b>${stats.selected.topFourCount}份（${stats.selected.topFourPercent}%）</b>将其选入四强。</p>
      </div>
      <div class="statistics-leaders">
        <div><small>冠军最多</small>${leaderMarkup(stats.leaders.champion)}</div>
        <div><small>亚军最多</small>${leaderMarkup(stats.leaders.runnerUp)}</div>
        <div><small>进入四强最多</small>${leaderMarkup(stats.leaders.topFour)}</div>
      </div>
      <p class="statistics-footnote">匿名随机编号仅用于避免刷新造成重复计数；不提交评选过程、姓名、账号或设备资料。</p>
    </section>`;
  }

  function updateStatisticsPanel() {
    const panel = document.querySelector("[data-statistics]");
    if (!panel) return;
    const template = document.createElement("template");
    template.innerHTML = statisticsMarkup().trim();
    panel.replaceWith(template.content.firstElementChild);
  }

  async function submitStatistics() {
    const placements = resultPlacements();
    if (!placements) {
      statisticsState = { status: "error", data: null, error: "无法从本次签表中读取完整四强，结果未提交。" };
      updateStatisticsPanel();
      return;
    }
    if (!tournament.statisticsSubmissionId) {
      tournament.statisticsSubmissionId = anonymousSubmissionId();
      saveTournament();
    }
    statisticsState = { status: "loading", data: null, error: "" };
    updateStatisticsPanel();
    try {
      const response = await fetch("/api/results", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project: "poet",
          submissionId: tournament.statisticsSubmissionId,
          championId: placements.champion.id,
          runnerUpId: placements.runnerUp.id,
          semifinalistIds: placements.semifinalists.map((poet) => poet.id)
        })
      });
      if (!response.ok) throw new Error("request failed");
      statisticsState = { status: "ready", data: await response.json(), error: "" };
    } catch (_) {
      statisticsState = { status: "error", data: null, error: "统计服务暂时无法连接；本地比赛结果不受影响。" };
    }
    updateStatisticsPanel();
  }

  function fullTitle(title) {
    return `${title}·诗界杯`;
  }

  function saveTournament() {
    try {
      if (tournament) localStorage.setItem(STORAGE_KEY, JSON.stringify(tournament));
      else localStorage.removeItem(STORAGE_KEY);
    } catch (_) {
      // Local files can still run when browser storage is unavailable.
    }
    updateResumeButton();
  }

  function loadTournament() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : null;
    } catch (_) {
      return null;
    }
  }

  function updateResumeButton() {
    resumeButton.classList.toggle("hidden", !loadTournament());
  }

  function showRestartConfirmation(trigger) {
    const overlay = document.querySelector("[data-confirm-restart]");
    if (!overlay) return;
    restartTrigger = trigger || document.activeElement;
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    overlay.querySelector('[data-action="cancel-restart"]')?.focus();
  }

  function hideRestartConfirmation() {
    const overlay = document.querySelector("[data-confirm-restart]");
    if (!overlay || overlay.hidden) return;
    overlay.hidden = true;
    document.body.style.overflow = "";
    restartTrigger?.focus?.();
    restartTrigger = null;
  }

  function abandonTournament() {
    hideRestartConfirmation();
    tournament = null;
    stageSelection.clear();
    undoStack = [];
    saveTournament();
    renderHome();
  }

  function formatWorkContent(content) {
    return String(content || "")
      .split(/\n{2,}/u)
      .map((paragraph) => `<p>${escapeHtml(paragraph).replace(/([。！？；])(?=.)/gu, "$1<br>")}</p>`)
      .join("");
  }

  function showRepresentativeWorks(poetId, trigger) {
    const poet = data.poets.find((item) => item.id === poetId);
    const overlay = document.querySelector("[data-works-overlay]");
    if (!poet || !overlay) return;
    const works = representativeWorks[poet.name] || [];
    worksTrigger = trigger || document.activeElement;
    overlay.querySelector("[data-works-title]").textContent = poet.name;
    overlay.querySelector("[data-works-meta]").textContent = `${poet.periodLabel} · ${departmentText(poet)} · ${works.length}篇代表作`;
    overlay.querySelector("[data-works-content]").innerHTML = works.length
      ? works.map((work, index) => `<article class="work-entry">
          <span class="work-number">${String(index + 1).padStart(2, "0")}</span>
          <h3>${escapeHtml(work.title)}</h3>
          <p class="work-byline">${escapeHtml(work.author)} · ${escapeHtml(work.dynasty || poet.periodLabel)}</p>
          <div class="work-text">${formatWorkContent(work.content)}</div>
        </article>`).join("")
      : '<p class="works-empty">这位诗人的代表作尚在整理中。</p>';
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    overlay.querySelector('[data-action="close-works"]')?.focus();
  }

  function hideRepresentativeWorks() {
    const overlay = document.querySelector("[data-works-overlay]");
    if (!overlay || overlay.hidden) return;
    overlay.hidden = true;
    document.body.style.overflow = "";
    worksTrigger?.focus?.();
    worksTrigger = null;
  }

  function remember() {
    undoStack.push(JSON.stringify(tournament));
    if (undoStack.length > 60) undoStack.shift();
  }

  function departmentText(poet) {
    if (poet.departments.length === 2) return "诗／词";
    return poet.departments[0] === "poetry" ? "诗" : "词";
  }

  function filteredPoets() {
    return data.poets.filter((poet) =>
      selectedPeriods.has(poet.period) &&
      poet.departments.some((genre) => selectedGenres.has(genre))
    );
  }

  function resetSelectionToTags() {
    selectedCustom = new Set(filteredPoets().map((poet) => poet.id));
  }

  function customTitle() {
    const periodKeys = data.periodOrder.filter((key) => selectedPeriods.has(key));
    const periodPart = periodKeys.length === data.periodOrder.length
      ? "古代"
      : periodKeys.map((key) => data.groups[key].titleLabel || data.groups[key].label).join("、");
    let genrePart = "诗（词）人";
    if (selectedGenres.size === 1) genrePart = selectedGenres.has("poetry") ? "诗人" : "词人";
    return periodPart + genrePart;
  }

  function formatForCount(count, selectedMode = "custom") {
    if (selectedMode === "default") {
      return { key: "default48", ready: true, label: "48 → 小组24 → 复活至32 → 淘汰赛" };
    }
    if (count < 24) return { key: "tooFew", ready: false, label: `还需加入 ${24 - count} 人` };
    if (count <= 31) return { key: "byes16", ready: true, label: `${count} → 自选${32 - count}人轮空 → 16强` };
    if (count <= 47) return { key: "cut32", ready: true, label: count === 32 ? "32 → 32强淘汰赛" : `${count} → 保留32 → 32强淘汰赛` };
    if (count === 48) return { key: "custom48", ready: true, label: "48 → 小组24 → 复活至32 → 淘汰赛" };
    if (count <= 56) return { key: "cut48", ready: true, label: `${count} → 保留48 → 小组24 → 复活至32 → 淘汰赛` };
    if (count <= 72) return { key: "prelim48", ready: true, label: `${count} → 三进二预选 → 复活至48 → 小组24 → 复活至32 → 淘汰赛` };
    return { key: "tooMany", ready: false, label: `需移除 ${count - 72} 人` };
  }

  function poetChip(poet, selected) {
    return `
      <button class="poet-chip ${selected ? "selected" : ""}" type="button"
        data-action="toggle-poet" data-id="${escapeHtml(poet.id)}" aria-pressed="${selected}">
        <strong>${escapeHtml(poet.name)}</strong>
        <small>${escapeHtml(poet.periodLabel)} · ${departmentText(poet)}</small>
      </button>`;
  }

  function renderHome() {
    tournament = null;
    stageSelection.clear();
    undoStack = [];
    app.innerHTML = heroMarkup() + (mode === "default" ? renderDefaultSection() : customSectionMarkup());
    updateResumeButton();
  }

  function startTournament() {
    const entrants = mode === "default"
      ? shuffle(data.defaultPoets)
      : shuffle(data.poets.filter((poet) => selectedCustom.has(poet.id)));
    const format = formatForCount(entrants.length, mode);
    if (!format.ready) return;

    tournament = {
      version: 4,
      title: mode === "default" ? "古代诗（词）人" : customTitle(),
      mode,
      initialCount: entrants.length,
      initialEntrants: entrants,
      format: format.key,
      phase: "",
      cut: null,
      prelim: null,
      prelimRevival: null,
      groupStage: null,
      groupRevival: null,
      byeSelection: null,
      knockout: null,
      transition: null,
      champion: null,
      statisticsSubmissionId: anonymousSubmissionId(),
      startedAt: new Date().toISOString()
    };
    undoStack = [];
    stageSelection.clear();

    if (format.key === "default48") setupGroupStage(entrants, 32);
    if (format.key === "byes16") setupKnockout(entrants);
    if (format.key === "cut32") entrants.length === 32 ? setupKnockout(entrants) : setupCut(entrants, 32, "knockout");
    if (format.key === "custom48") setupGroupStage(entrants, 32);
    if (format.key === "cut48") setupCut(entrants, 48, "groups");
    if (format.key === "prelim48") setupPrelim(entrants);
    saveTournament();
    renderStage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function setupCut(entrants, target, next) {
    tournament.phase = "cut";
    tournament.cut = { entrants, target, next, kept: null, eliminated: null };
  }

  function buildGroups(entrants, size) {
    const groups = [];
    for (let i = 0; i < entrants.length; i += size) {
      const members = entrants.slice(i, i + size);
      groups.push({
        entrants: members,
        survivors: members.length <= 2 ? [...members] : null,
        eliminated: members.length <= 2 ? [] : null,
        automatic: members.length <= 2
      });
    }
    return groups;
  }

  function firstPendingGroup(groups) {
    return groups.findIndex((group) => !group.survivors);
  }

  function setupPrelim(entrants) {
    const groups = buildGroups(shuffle(entrants), 3);
    tournament.prelim = { entrants, groups, current: firstPendingGroup(groups) };
    tournament.phase = "prelim";
    if (tournament.prelim.current === -1) finishGroups("prelim");
  }

  function setupGroupStage(entrants, target) {
    const groups = buildGroups(shuffle(entrants), 4);
    tournament.groupStage = { entrants, groups, current: firstPendingGroup(groups), target };
    tournament.phase = "groups";
    if (tournament.groupStage.current === -1) finishGroups("groups");
  }

  function setupRevival(kind, survivors, eliminated, target) {
    const required = target - survivors.length;
    if (required <= 0) {
      if (kind === "prelim") setupGroupStage(survivors.slice(0, target), 32);
      else setupKnockout(survivors.slice(0, target));
      return;
    }
    const revival = { survivors, candidates: eliminated, required, selected: null };
    if (kind === "prelim") {
      tournament.prelimRevival = revival;
      tournament.phase = "prelim-revival";
    } else {
      tournament.groupRevival = revival;
      tournament.phase = "group-revival";
    }
  }

  function setupKnockout(entrants) {
    tournament.knockout = { rounds: [], currentRound: 0, currentMatch: 0 };
    const ordered = shuffle(entrants);
    const required = byeCountFor(ordered.length);
    if (required > 0) {
      tournament.byeSelection = { entrants: ordered, required, selected: null };
      tournament.phase = "bye-selection";
      return;
    }
    tournament.phase = "knockout";
    makeKnockoutRound(ordered);
  }

  function byeCountFor(count) {
    const bracketSize = 2 ** Math.ceil(Math.log2(count));
    return bracketSize - count;
  }

  function distributedByePositions(matchCount, byeCount) {
    const positions = [];
    for (let index = 0; index < matchCount && positions.length < byeCount; index += 2) positions.push(index);
    for (let index = 1; index < matchCount && positions.length < byeCount; index += 2) positions.push(index);
    return new Set(positions);
  }

  function buildKnockoutRound(entrants, selectedByes = []) {
    const ordered = [...entrants];
    const bracketSize = 2 ** Math.ceil(Math.log2(ordered.length));
    const matchCount = bracketSize / 2;
    const byeCount = bracketSize - ordered.length;
    if (selectedByes.length !== byeCount) throw new Error(`Expected ${byeCount} selected byes, got ${selectedByes.length}`);
    const byePositions = distributedByePositions(matchCount, byeCount);
    const byeIds = new Set(selectedByes.map((poet) => poet.id));
    // The draw is shuffled once in setupKnockout. Never reshuffle between
    // knockout rounds: adjacent winners must stay on the same bracket path.
    const byePool = ordered.filter((poet) => byeIds.has(poet.id));
    const playingPool = ordered.filter((poet) => !byeIds.has(poet.id));
    const round = { entrants: [], byes: [], matches: [] };
    for (let matchIndex = 0; matchIndex < matchCount; matchIndex += 1) {
      if (byePositions.has(matchIndex)) {
        const a = byePool.shift();
        round.entrants.push(a);
        round.byes.push(a);
        round.matches.push({ a, b: null, winner: a, automatic: true });
      } else {
        const a = playingPool.shift();
        const b = playingPool.shift();
        round.entrants.push(a, b);
        round.matches.push({ a, b, winner: null, automatic: false });
      }
    }
    return round;
  }

  function makeKnockoutRound(entrants, selectedByes = []) {
    const round = buildKnockoutRound(entrants, selectedByes);
    tournament.knockout.rounds.push(round);
    tournament.knockout.currentRound = tournament.knockout.rounds.length - 1;
    tournament.knockout.currentMatch = firstPendingMatch(round);
  }

  function confirmByes() {
    const state = tournament.byeSelection;
    if (!state || stageSelection.size !== state.required) return;
    remember();
    state.selected = state.entrants.filter((poet) => stageSelection.has(poet.id));
    stageSelection.clear();
    tournament.phase = "knockout";
    makeKnockoutRound(state.entrants, state.selected);
    saveTournament();
    renderStage();
  }

  function firstPendingMatch(round) {
    return round.matches.findIndex((match) => !match.winner);
  }

  function showTransition(kicker, title, meta, advanced, eliminated, next) {
    tournament.transition = {
      kicker,
      title,
      meta,
      advanced: unique(advanced),
      eliminated: unique(eliminated),
      next
    };
    tournament.phase = "transition";
  }

  function continueTransition() {
    const transition = tournament.transition;
    if (!transition) return;
    remember();
    tournament.transition = null;
    const next = transition.next;
    if (next.type === "revival") setupRevival(next.kind, transition.advanced, transition.eliminated, next.target);
    if (next.type === "groups") setupGroupStage(transition.advanced, next.target);
    if (next.type === "knockout") setupKnockout(transition.advanced);
    if (next.type === "knockout-round") {
      tournament.phase = "knockout";
      makeKnockoutRound(transition.advanced);
    }
    if (next.type === "result") {
      tournament.champion = transition.advanced[0];
      tournament.phase = "result";
    }
    saveTournament();
    renderStage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function currentGroupState() {
    return tournament.phase === "prelim" ? tournament.prelim : tournament.groupStage;
  }

  function finishGroups(kind) {
    const state = kind === "prelim" ? tournament.prelim : tournament.groupStage;
    const survivors = unique(state.groups.flatMap((group) => group.survivors || []));
    const eliminated = unique(state.groups.flatMap((group) => group.eliminated || []));
    stageSelection.clear();
    const stageName = kind === "prelim" ? "\u9884\u9009\u8d5b" : "\u5c0f\u7ec4\u8d5b";
    const target = kind === "prelim" ? 48 : state.target;
    showTransition(
      `${stageName}\u7ed3\u675f`,
      `${survivors.length}\u4eba\u76f4\u63a5\u664b\u7ea7`,
      `${eliminated.length}\u4eba\u6682\u5217\u6dd8\u6c70\u533a\uff1b\u4e0b\u4e00\u9875\u5c06\u4ece\u4e2d\u9009\u62e9\u590d\u6d3b\u9009\u624b\u3002`,
      survivors,
      eliminated,
      { type: "revival", kind, target }
    );
  }

  function confirmCut() {
    const state = tournament.cut;
    if (stageSelection.size !== state.target) return;
    remember();
    state.kept = state.entrants.filter((poet) => stageSelection.has(poet.id));
    state.eliminated = state.entrants.filter((poet) => !stageSelection.has(poet.id));
    stageSelection.clear();
    showTransition(
      "\u540d\u5355\u88c1\u5b9a\u7ed3\u675f",
      `${state.kept.length}\u4eba\u8fdb\u5165\u6b63\u8d5b`,
      `${state.eliminated.length}\u4eba\u6b62\u6b65\u540d\u5355\u88c1\u5b9a\u3002`,
      state.kept,
      state.eliminated,
      state.next === "groups" ? { type: "groups", target: 32 } : { type: "knockout" }
    );
    saveTournament();
    renderStage();
  }

  function confirmGroup() {
    const state = currentGroupState();
    const group = state.groups[state.current];
    if (!group || stageSelection.size !== 2) return;
    remember();
    group.survivors = group.entrants.filter((poet) => stageSelection.has(poet.id));
    group.eliminated = group.entrants.filter((poet) => !stageSelection.has(poet.id));
    stageSelection.clear();
    state.current = firstPendingGroup(state.groups);
    if (state.current === -1) finishGroups(tournament.phase === "prelim" ? "prelim" : "groups");
    saveTournament();
    renderStage();
  }

  function confirmRevival() {
    const kind = tournament.phase;
    const state = kind === "prelim-revival" ? tournament.prelimRevival : tournament.groupRevival;
    if (stageSelection.size !== state.required) return;
    remember();
    state.selected = state.candidates.filter((poet) => stageSelection.has(poet.id));
    const entrants = unique([...state.survivors, ...state.selected]);
    const eliminated = state.candidates.filter((poet) => !stageSelection.has(poet.id));
    stageSelection.clear();
    showTransition(
      "\u590d\u6d3b\u8d5b\u7ed3\u675f",
      `${entrants.length}\u4eba\u664b\u7ea7\u4e0b\u4e00\u9636\u6bb5`,
      `${state.selected.length}\u4eba\u590d\u6d3b\u6210\u529f\uff0c${eliminated.length}\u4eba\u672c\u5c4a\u6b62\u6b65\u3002`,
      entrants,
      eliminated,
      kind === "prelim-revival" ? { type: "groups", target: 32 } : { type: "knockout" }
    );
    saveTournament();
    renderStage();
  }

  function knockoutRound() {
    return tournament.knockout.rounds[tournament.knockout.currentRound];
  }

  function knockoutMatch() {
    return knockoutRound().matches[tournament.knockout.currentMatch];
  }

  function chooseWinner(id) {
    if (tournament.phase !== "knockout" || tournament.champion) return;
    remember();
    const round = knockoutRound();
    const match = knockoutMatch();
    if (!match || !match.b || match.winner) return;
    match.winner = match.a.id === id ? match.a : match.b;
    tournament.knockout.currentMatch = firstPendingMatch(round);

    if (tournament.knockout.currentMatch === -1) {
      const winners = round.matches.map((item) => item.winner);
      const winnerIds = new Set(winners.map((poet) => poet.id));
      const eliminated = round.entrants.filter((poet) => !winnerIds.has(poet.id));
      const currentLabel = roundLabel(round.entrants.length);
      showTransition(
        `${currentLabel}\u7ed3\u675f`,
        winners.length === 1 ? `${winners[0].name}\u593a\u5f97\u8bd7\u754c\u676f` : `${winners.length}\u4eba\u664b\u7ea7${roundLabel(winners.length)}`,
        `${eliminated.length}\u4eba\u6b62\u6b65${currentLabel}\u3002`,
        winners,
        eliminated,
        winners.length === 1 ? { type: "result" } : { type: "knockout-round" }
      );
    }
    saveTournament();
    renderStage();
  }

  function toggleStageSelection(id, limit) {
    if (stageSelection.has(id)) stageSelection.delete(id);
    else if (stageSelection.size < limit) stageSelection.add(id);
    renderStage();
  }

  function undo() {
    if (!undoStack.length) return;
    tournament = JSON.parse(undoStack.pop());
    stageSelection.clear();
    saveTournament();
    renderStage();
  }

  function renderByeSelection() {

    app.innerHTML = `<section class="stage-shell">
      ${stageHeader("轮空选择", `选择${state.required}人轮空`, `${state.entrants.length}人中选择${state.required}人直接进入16强；其余${playingCount}人进行${playingCount / 2}场比赛。`, progress)}
      <div class="stage-card">

        <h2>决定轮空名单</h2>
        <p class="stage-instruction">已选 ${selected}/${state.required} 人。轮空者直接进入16强，其余选手两两对决。</p>
        <div class="candidate-grid">
          ${state.entrants.map((poet, index) => candidateCard(poet, stageSelection.has(poet.id), index)).join("")}
        </div>
        <div class="group-footer">
          <p>${selected === state.required ? "轮空名单已满，可以开始比赛。" : `还需选择 ${state.required - selected} 人。`}</p>
          <button class="primary-button" type="button" data-action="confirm-byes" ${selected === state.required ? "" : "disabled"}>确认轮空名单</button>
        </div>
      </div>
      ${stageActions()}
    </section>`;
  }

  function transitionPerson(poet, status) {
    return `<div class="transition-person ${status}">
      <strong>${escapeHtml(poet.name)}</strong>
      <span>${escapeHtml(poet.periodLabel)} · ${departmentText(poet)}</span>

  function renderTransition() {

      ${stageHeader(state.kicker, state.title, state.meta, 100)}
      <div class="transition-card">
        <div class="transition-emblem" aria-hidden="true">晋</div>
        <p class="stage-kicker">STAGE COMPLETE</p>
        <h2>本阶段成绩已定</h2>

        <div class="transition-columns">

          </section>

  function roundLabel(count) {

    if (count === 4) return "半决赛";

    if (count === 16) return "十六强赛";
    if (count > 16 && count < 32) return "十六强资格赛";
    if (count === 32) return "三十二强赛";

  }

  function fighterMarkup(poet, index) {

  function renderKnockout() {

      ${round.byes.length ? `<div class="bye-note">本轮轮空：${round.byes.map((poet) => escapeHtml(poet.name)).join("、")}，自动进入下一轮。</div>` : ""}
      <div class="versus">
        ${fighterMarkup(match.a, "甲")}
        <div class="vs-mark">VS</div>
        ${fighterMarkup(match.b, "乙")}

  function stageActions() {

      <button class="danger-button" type="button" data-action="restart">放弃本次比赛</button>
    </div>`;
  }

  function groupSummary(title, state) {
    if (!state) return "";
    return `<div class="result-section"><h3>${escapeHtml(title)}</h3><div class="summary-groups">
      ${state.groups.map((group, index) => {
        const survivorIds = new Set((group.survivors || []).map((poet) => poet.id));
        return `<div class="summary-group"><strong>第 ${index + 1} 组${group.automatic ? " · 自动晋级" : ""}</strong>
          ${group.entrants.map((poet) => `<span class="${survivorIds.has(poet.id) ? "advanced" : ""}">${escapeHtml(poet.name)}${survivorIds.has(poet.id) ? " ↑" : ""}</span>`).join("")}
        </div>`;
      }).join("")}
